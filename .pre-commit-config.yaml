# Pre-commit hook configuration for knowledgebase governance guardrails.
# Run locally: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files
# See docs/ideas/pre-commit-guardrails.md for design rationale.

default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: local
    hooks:
      - id: no-staged-lock-files
        name: Governance lock files must not be staged
        language: python
        entry: python -m scripts.hooks.check_no_staged_locks
        types: [file]
        exclude: "^tests/"
        pass_filenames: true

      - id: mixed-scope-commit-guard
        name: Block mixed-scope intake/control-plane commits
        language: python
        entry: python -m scripts.hooks.check_mixed_scope
        types: [file]
        pass_filenames: false

      - id: frontmatter-validation
        name: Wiki, skill, and agent persona frontmatter validation
        language: python
        entry: python -m scripts.hooks.check_frontmatter
        types: [markdown]
        pass_filenames: true

      - id: hooks-json-validation
        name: hooks.json structure validation
        language: python
        entry: python -m scripts.hooks.check_hooks_json
        files: '\.github/hooks/hooks\.json$'
        types_or: [json]
        pass_filenames: true

      - id: locality-ratchet-pre-commit
        name: Locality 4 paired-deletion or trailer enforcement (pre-commit stage)
        language: python
        entry: python -m scripts.hooks.check_locality_ratchet
        stages: [pre-commit]
        files: '^(\.github/copilot-instructions\.md|AGENTS\.md)$'
        pass_filenames: true

      - id: locality-ratchet-commit-msg
        name: Locality 4 trailer rolling-window soft budget (commit-msg stage)
        language: python
        entry: python -m scripts.hooks.check_locality_ratchet
        stages: [commit-msg]
        args: [--commit-msg-file]
        pass_filenames: true

      - id: test-framework-ratchet
        name: pytest canonical framework ratchet (block new unittest.TestCase tests)
        language: python
        entry: python -m scripts.hooks.check_test_framework
        stages: [pre-commit]
        pass_filenames: false

      - id: approval-flag-ratchet
        name: approval-flag migration ratchet (block new --approval usage)
        language: python
        entry: python -m scripts.hooks.check_approval_flag
        stages: [pre-commit]
        files: '^scripts/'
        pass_filenames: false

      - id: sourceref-format
        name: SourceRef citation format validation
        language: python
        entry: python -m scripts.hooks.check_sourceref_format
        files: '^wiki/'
        types: [markdown]
        pass_filenames: true

      - id: context-md-format
        name: CONTEXT.md format validation
        language: python
        entry: python -m scripts.hooks.check_context_md_format
        files: 'CONTEXT\.md$'
        pass_filenames: true

      - id: instructions-applyto-present
        name: .github/instructions files require applyTo frontmatter
        language: python
        entry: python -m scripts.hooks.check_instructions_applyto_present
        files: '^\.github/instructions/.*\.instructions\.md$'
        types: [markdown]
        pass_filenames: true

      - id: write-surface-matrix-lint
        name: Write-surface matrix coverage lint
        language: python
        entry: python -m scripts.hooks.check_matrix_coverage
        types: [python]
        pass_filenames: true

      - id: adr-cross-ref-cascade
        name: ADR status change cascade — README.md must be staged
        language: python
        entry: python -m scripts.hooks.check_adr_cross_ref
        files: '^docs/decisions/ADR-'
        types: [markdown]
        pass_filenames: true

      - id: stub-archive-path
        name: docs/ideas/ stub archive pointer validation
        language: python
        entry: python -m scripts.hooks.check_stub_archive_path
        files: '^docs/ideas/'
        types: [markdown]
        pass_filenames: true

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args:
          - --baseline
          - .secrets.baseline
        exclude: "^(tests/|docs/ideas/)"
