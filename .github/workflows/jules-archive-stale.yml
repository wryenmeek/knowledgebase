# .github/workflows/jules-archive-stale.yml
#
# Bulk-archive stale Jules sessions. Dry-run by default; pass apply=true to
# actually archive matched sessions.
#
# Triggers: manual dispatch only (workflow_dispatch). No schedule.
# Inputs:
#   state         — session state to filter on (default: inProgress)
#   older_than_days — required; minimum age in days (no default to avoid mass-archive)
#   source_filter — source ID to scope the archive (default: sources/github/wryenmeek/knowledgebase)
#                   Required when apply=true; the script exits non-zero if apply=true and this is empty.
#                   Use 'sources/github/owner/repo' for other repos, or leave as default for this repo.
#   apply         — set to "true" to perform real archive calls (default: false / dry-run)
#
# SECURITY: all inputs are routed through env: blocks before use in run: steps
# to prevent GitHub Actions shell-injection via expression expansion.
name: Jules Archive Stale Sessions

on:
  workflow_dispatch:
    inputs:
      state:
        description: "Session state to archive (default: inProgress)"
        type: string
        default: "inProgress"
      older_than_days:
        description: "Archive sessions older than N days (required — no default)"
        type: string
        required: true
      source_filter:
        description: "Source scope for archive. Use 'sources/github/wryenmeek/knowledgebase' for this repo. When apply=true, this must be non-empty — the shell step only passes --source-filter when non-empty, so an empty value with apply=true will cause the script to exit non-zero."
        type: string
        default: "sources/github/wryenmeek/knowledgebase"
      apply:
        description: "Set to true to perform real archive calls (default: false = dry-run)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.apply == true && 'jules-archive-approval' || '' }}
    concurrency:
      group: jules-archive-stale-${{ inputs.apply }}
      cancel-in-progress: false
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.1"

      - name: Install fleet dependencies
        working-directory: scripts/fleet
        run: bun install

      - name: Archive stale sessions
        id: archive
        working-directory: scripts/fleet
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          # SECURITY: all workflow inputs are passed through env vars, not interpolated
          # directly in the run block, to prevent shell injection.
          INPUT_STATE: ${{ inputs.state }}
          INPUT_OLDER_THAN_DAYS: ${{ inputs.older_than_days }}
          INPUT_SOURCE_FILTER: ${{ inputs.source_filter }}
          INPUT_APPLY: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          ARGS=(--state "$INPUT_STATE" --older-than-days "$INPUT_OLDER_THAN_DAYS")
          if [ -n "$INPUT_SOURCE_FILTER" ]; then
            ARGS+=(--source-filter "$INPUT_SOURCE_FILTER")
          fi
          if [ "$INPUT_APPLY" = "true" ]; then
            ARGS+=(--apply)
          fi
          bun run archive-stale-sessions.ts "${ARGS[@]}" | tee /tmp/archive-output.json

      - name: Upload archive results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: jules-archive-stale-${{ github.run_id }}
          path: /tmp/archive-output.json
          retention-days: 7
