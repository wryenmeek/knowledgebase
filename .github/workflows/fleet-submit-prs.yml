# .github/workflows/fleet-submit-prs.yml
#
# Daily sweep of Jules sessions stuck in `awaitingUserFeedback` state.
# For each matching session, sends the canonical "Please submit your changes
# as a Pull Request now." prompt so the agent proceeds without operator
# intervention.  Also applies the `awaiting-feedback` GitHub label to any
# issue linked via the session's working branch name.
#
# Schedule: daily at 04:00 UTC — chosen to land after the 02:00 sweeper and
# ~2 hours before the 06:00 fleet-plan run, giving un-stuck sessions time to
# produce PRs before the next plan cycle.
#
# SECURITY: JULES_API_KEY is declared step-scoped (not job-level) per the
# "Step-scoped secret binding for high-value tokens" rule in AGENTS.md.
name: Fleet Submit PRs

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: fleet-submit-prs
  cancel-in-progress: false

jobs:
  submit-prs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.1"

      - name: Cache Bun dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('scripts/fleet/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install fleet dependencies
        working-directory: scripts/fleet
        run: bun install

      - name: Sweep awaitingUserFeedback sessions
        working-directory: scripts/fleet
        env:
          # SECURITY: JULES_API_KEY declared step-scoped per AGENTS.md
          # "Step-scoped secret binding for high-value tokens" rule.
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run fleet-submit-prs.ts
