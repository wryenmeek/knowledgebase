name: CI-5 GitHub Source Monitor

on:
  schedule:
    # Run daily at 06:30 UTC (offset from fleet-plan at 06:00 to avoid runner contention).
    - cron: '30 6 * * *'
  # Event-driven trigger: fired by a GitHub App webhook relay when a monitored
  # upstream repo is pushed. Allows immediate drift detection without waiting
  # for the daily cron. Keep cron as safety-net fallback.
  repository_dispatch:
    types: [upstream-source-updated]
  workflow_dispatch:
    inputs:
      registry_path:
        description: |
          Optional: path to a single registry file
          (e.g. raw/github-sources/org-repo.source-registry.json).
          Omit to check all registries.
        required: false
        type: string

# Workflow-level permissions are read-only.
# The write-capable jobs override at job level.
permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  # CI permission policy markers (machine-checked by test_ci_permission_asserts.py)
  CI_ID: CI-5
  TOKEN_PROFILE: tp-github-monitor

jobs:
  check-drift:
    name: CI-5 drift detection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      drift_detected: ${{ steps.detect.outputs.drift_detected }}
      artifact_name: ${{ steps.detect.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-metadata: read

      - name: Mask GitHub App token
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: echo "::add-mask::${APP_TOKEN}"

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -e . --quiet

      - name: Check drift across all registries
        id: detect
        env:
          GITHUB_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          # SECURITY: pass workflow_dispatch input as env var, never interpolate
          # ${{ inputs.* }} directly into a run: shell block (shell injection risk).
          REGISTRY_PATH: ${{ inputs.registry_path }}
          # SECURITY: pass repository_dispatch payload via env var, never interpolate
          # ${{ github.event.* }} directly into a run: shell block.
          DISPATCH_REGISTRY_PATH: ${{ github.event.client_payload.registry_path }}
          DISPATCH_SOURCE_KIND: ${{ github.event.client_payload.source_kind }}
          DISPATCH_DELIVERY_ID: ${{ github.event.client_payload.delivery_id }}
          DISPATCH_UPSTREAM_REPO: ${{ github.event.client_payload.upstream_repo }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          CI5_TRUSTED_DISPATCH_ACTORS: github-actions[bot],${{ github.repository_owner }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          mkdir -p runtime-metrics

          is_allowlisted_registry_path() {
            local candidate="${1:-}"
            [[ -n "${candidate}" ]] \
              && [[ "${candidate}" == raw/github-sources/*.source-registry.json ]] \
              && [[ "${candidate}" != *".."* ]] \
              && [[ "${candidate}" != /* ]] \
              && [[ -f "${candidate}" ]]
          }

          is_trusted_dispatch_actor() {
            local candidate="${1:-}"
            local allowlist_csv="${CI5_TRUSTED_DISPATCH_ACTORS:-}"
            [[ -z "${candidate}" ]] && return 1
            local allowlist_actor
            IFS=',' read -r -a allowlist <<< "${allowlist_csv}"
            for allowlist_actor in "${allowlist[@]}"; do
              allowlist_actor="$(echo "${allowlist_actor}" | xargs)"
              [[ -z "${allowlist_actor}" ]] && continue
              if [[ "${candidate}" == "${allowlist_actor}" ]]; then
                return 0
              fi
            done
            return 1
          }

          REGISTRY_ARGS=()
          EFFECTIVE_REGISTRY_PATH=""
          REGISTRY_HINT_SOURCE=""
          REGISTRY_HINT_VALUE=""
          FALLBACK_REASON=""

          if [ "${GITHUB_EVENT_NAME}" = "repository_dispatch" ]; then
            if ! is_trusted_dispatch_actor "${GITHUB_ACTOR:-}"; then
              echo "::error::CI-5 repository_dispatch rejected: untrusted actor=${GITHUB_ACTOR:-unknown}." >&2
              exit 1
            fi

            dispatch_contract_errors=()
            if [ "${DISPATCH_SOURCE_KIND:-}" != "github" ]; then
              dispatch_contract_errors+=("source_kind")
            fi
            if [ -z "${DISPATCH_DELIVERY_ID:-}" ]; then
              dispatch_contract_errors+=("delivery_id")
            fi
            if [[ ! "${DISPATCH_UPSTREAM_REPO:-}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
              dispatch_contract_errors+=("upstream_repo")
            fi
            if [ "${#dispatch_contract_errors[@]}" -gt 0 ]; then
              printf '::error::CI-5 repository_dispatch rejected: missing/invalid payload contract fields=%s\n' "$(IFS=,; echo "${dispatch_contract_errors[*]}")" >&2
              exit 1
            fi
          fi

          if [ "${GITHUB_EVENT_NAME}" = "repository_dispatch" ]; then
            REGISTRY_HINT_SOURCE="repository_dispatch"
            REGISTRY_HINT_VALUE="${DISPATCH_REGISTRY_PATH:-}"
          elif [ -n "${REGISTRY_PATH}" ]; then
            REGISTRY_HINT_SOURCE="workflow_dispatch"
            REGISTRY_HINT_VALUE="${REGISTRY_PATH}"
          fi

          if [ -n "${REGISTRY_HINT_VALUE}" ]; then
            if is_allowlisted_registry_path "${REGISTRY_HINT_VALUE}"; then
              EFFECTIVE_REGISTRY_PATH="${REGISTRY_HINT_VALUE}"
              printf 'CI-5 targeted mode source=%s registry_path=%q\n' "${REGISTRY_HINT_SOURCE}" "${EFFECTIVE_REGISTRY_PATH}"
            else
              FALLBACK_REASON="invalid_registry_hint"
              printf 'CI-5 full-scan fallback reason=invalid_registry_hint source=%s registry_path=%q\n' "${REGISTRY_HINT_SOURCE}" "${REGISTRY_HINT_VALUE}" >&2
            fi
          elif [ "${GITHUB_EVENT_NAME}" = "repository_dispatch" ]; then
            FALLBACK_REASON="missing_registry_hint"
            echo "CI-5 full-scan fallback reason=missing_registry_hint source=repository_dispatch"
          fi

          if [ -n "${EFFECTIVE_REGISTRY_PATH}" ]; then
            REGISTRY_ARGS=(--registry "${EFFECTIVE_REGISTRY_PATH}")
          fi

          REGISTRY_HINT_SOURCE="${REGISTRY_HINT_SOURCE}" \
          REGISTRY_HINT_VALUE="${REGISTRY_HINT_VALUE}" \
          EFFECTIVE_REGISTRY_PATH="${EFFECTIVE_REGISTRY_PATH}" \
          FALLBACK_REASON="${FALLBACK_REASON}" \
          python3 - <<'PY' > runtime-metrics/fallback-telemetry.json
          import json
          import os

          payload = {
              "event_name": os.environ.get("GITHUB_EVENT_NAME", ""),
              "registry_hint_source": os.environ.get("REGISTRY_HINT_SOURCE", ""),
              "registry_hint_value": os.environ.get("REGISTRY_HINT_VALUE", ""),
              "effective_registry_path": os.environ.get("EFFECTIVE_REGISTRY_PATH", ""),
              "fallback_reason": os.environ.get("FALLBACK_REASON", ""),
              "fallback_triggered": bool(os.environ.get("FALLBACK_REASON", "")),
              "github_actor": os.environ.get("GITHUB_ACTOR", ""),
              "dispatch_source_kind": os.environ.get("DISPATCH_SOURCE_KIND", ""),
              "dispatch_delivery_id": os.environ.get("DISPATCH_DELIVERY_ID", ""),
              "dispatch_upstream_repo": os.environ.get("DISPATCH_UPSTREAM_REPO", ""),
              "run_attempt": int(os.environ.get("GITHUB_RUN_ATTEMPT", "1")),
          }
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

          if [ "${FALLBACK_REASON}" = "invalid_registry_hint" ] && [ "${GITHUB_EVENT_NAME}" = "repository_dispatch" ]; then
            if [ "${GITHUB_RUN_ATTEMPT:-1}" -gt 1 ]; then
              echo "::warning::CI-5 repeated invalid-hint fallback detected (run_attempt=${GITHUB_RUN_ATTEMPT}) delivery_id=${DISPATCH_DELIVERY_ID:-unknown} actor=${GITHUB_ACTOR:-unknown}."
            else
              echo "::warning::CI-5 invalid-hint fallback detected delivery_id=${DISPATCH_DELIVERY_ID:-unknown} actor=${GITHUB_ACTOR:-unknown}."
            fi
          fi

          # Run drift detection; exits 0 on success (even when drift is found),
          # exits 1 on API errors or configuration errors.
          check_drift_start="$(date -u +%s)"
          python -m scripts.github_monitor.check_drift \
            "${REGISTRY_ARGS[@]}" \
            --output drift-report.json
          check_drift_end="$(date -u +%s)"
          check_drift_duration="$((check_drift_end - check_drift_start))"

          CHECK_DRIFT_DURATION="${check_drift_duration}" python3 - <<'PY' > runtime-metrics/check-drift-runtime-metrics.json
          import json
          import os

          payload = {
              "workflow_id": "ci-5-check-drift",
              "stage_durations_seconds": {
                  "check_drift": int(os.environ["CHECK_DRIFT_DURATION"]),
              },
          }
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

          # Parse has_drift from the report to set the job output.
          HAS_DRIFT=$(python -c "
          import json, sys
          with open('drift-report.json') as f:
              d = json.load(f)
          print('true' if d.get('has_drift') else 'false')
          ")
          ARTIFACT_NAME="drift-report-${{ github.run_id }}"

          echo "drift_detected=${HAS_DRIFT}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
          echo "Drift detected: ${HAS_DRIFT}"

      - name: Evaluate CI-5 check-drift runtime budgets
        id: runtime-budget
        run: |
          set -euo pipefail
          python3 -m scripts.validation.evaluate_runtime_budget \
            --metrics runtime-metrics/check-drift-runtime-metrics.json \
            --report runtime-metrics/check-drift-runtime-budget-report.json \
            --budget-config schema/runtime-budgets.json

      - name: Warn on CI-5 check-drift runtime budget breaches
        if: steps.runtime-budget.outputs.overall_status == 'warn'
        run: |
          set -euo pipefail
          echo "::warning::CI-5 check-drift runtime budgets exceeded warn threshold(s). See runtime-metrics/check-drift-runtime-budget-report.json."

      - name: Upload drift report artifact
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ steps.detect.outputs.artifact_name || format('drift-report-{0}', github.run_id) }}
          path: |
            drift-report.json
            runtime-metrics/fallback-telemetry.json
            runtime-metrics/check-drift-runtime-metrics.json
            runtime-metrics/check-drift-runtime-budget-report.json
          retention-days: 7

      - name: Fail on severe CI-5 check-drift runtime budget breach
        if: steps.runtime-budget.outputs.overall_status == 'fail'
        run: |
          set -euo pipefail
          echo "::error::CI-5 check-drift runtime budgets exceeded fail threshold(s). See runtime-metrics/check-drift-runtime-budget-report.json."
          exit 1

  fetch-and-update:
    name: CI-5 fetch + registry update
    needs: check-drift
    if: needs.check-drift.outputs.drift_detected == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Protected environment gate — requires the same approval as CI-3.
    environment: protected-pr-write
    concurrency:
      group: kb-write-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      WRITE_ALLOWLIST: raw/assets/**,raw/github-sources/**
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: true
          fetch-depth: 0

      # Regenerate token close to use to avoid 55-minute expiry on long jobs.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-metadata: read

      - name: Mask GitHub App token
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: echo "::add-mask::${APP_TOKEN}"

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -e . --quiet

      - name: Download drift report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.check-drift.outputs.artifact_name }}

      - name: Fetch assets and update registry
        env:
          GITHUB_APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          mkdir -p runtime-metrics
          fetch_start="$(date -u +%s)"
          python -m scripts.github_monitor.fetch_content \
            --drift-report drift-report.json \
            --apply
          fetch_end="$(date -u +%s)"
          fetch_duration="$((fetch_end - fetch_start))"

          FETCH_DURATION="${fetch_duration}" python3 - <<'PY' > runtime-metrics/fetch-runtime-metrics.json
          import json
          import os

          payload = {
              "workflow_id": "ci-5-fetch-and-update",
              "stage_durations_seconds": {
                  "fetch_content": int(os.environ["FETCH_DURATION"]),
              },
          }
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Evaluate CI-5 fetch-and-update runtime budgets
        id: runtime-budget
        run: |
          set -euo pipefail
          python3 -m scripts.validation.evaluate_runtime_budget \
            --metrics runtime-metrics/fetch-runtime-metrics.json \
            --report runtime-metrics/fetch-runtime-budget-report.json \
            --budget-config schema/runtime-budgets.json

      - name: Warn on CI-5 fetch runtime budget breaches
        if: steps.runtime-budget.outputs.overall_status == 'warn'
        run: |
          set -euo pipefail
          echo "::warning::CI-5 fetch-and-update runtime budgets exceeded warn threshold(s). See runtime-metrics/fetch-runtime-budget-report.json."

      - name: Upload fetched state for downstream jobs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: fetched-state-${{ github.run_id }}
          path: |
            raw/assets/
            raw/github-sources/
            runtime-metrics/fetch-runtime-metrics.json
            runtime-metrics/fetch-runtime-budget-report.json
          retention-days: 7

      - name: Fail on severe CI-5 fetch runtime budget breach
        if: steps.runtime-budget.outputs.overall_status == 'fail'
        run: |
          set -euo pipefail
          echo "::error::CI-5 fetch-and-update runtime budgets exceeded fail threshold(s). See runtime-metrics/fetch-runtime-budget-report.json."
          exit 1

  classify-drift:
    name: CI-5 HITL/AFK classification
    needs: [check-drift, fetch-and-update]
    if: needs.fetch-and-update.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    outputs:
      has_afk: ${{ steps.classify.outputs.has_afk }}
      has_hitl: ${{ steps.classify.outputs.has_hitl }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -e . --quiet

      - name: Download drift report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.check-drift.outputs.artifact_name }}

      - name: Classify drift entries as HITL or AFK
        id: classify
        run: |
          set -euo pipefail
          mkdir -p runtime-metrics
          : > runtime-metrics/classify-stage-durations.env
          classify_start="$(date -u +%s)"
          set +e
          python3 -m scripts.github_monitor.classify_drift \
            --drift-report drift-report.json \
            --output-dir .
          classify_exit=$?
          set -e
          classify_end="$(date -u +%s)"
          classify_duration="$((classify_end - classify_start))"
          echo "classify_drift=${classify_duration}" >> runtime-metrics/classify-stage-durations.env
          if [ "${classify_exit}" -ne 0 ]; then
            exit "${classify_exit}"
          fi

      - name: Upload classification artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: drift-classification-${{ github.run_id }}
          path: |
            afk-entries.json
            hitl-entries.json
          retention-days: 7

      - name: Create GitHub Issues for HITL entries
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          create_issues_start="$(date -u +%s)"
          set +e
          python3 -m scripts.github_monitor.create_issues \
            --hitl-entries hitl-entries.json
          create_issues_exit=$?
          set -e
          create_issues_end="$(date -u +%s)"
          create_issues_duration="$((create_issues_end - create_issues_start))"
          echo "create_issues=${create_issues_duration}" >> runtime-metrics/classify-stage-durations.env
          if [ "${create_issues_exit}" -ne 0 ]; then
            exit "${create_issues_exit}"
          fi

      - name: Close resolved HITL issues
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          close_issues_start="$(date -u +%s)"
          set +e
          python3 -m scripts.github_monitor.create_issues \
            --hitl-entries hitl-entries.json \
            --close-resolved
          close_issues_exit=$?
          set -e
          close_issues_end="$(date -u +%s)"
          close_issues_duration="$((close_issues_end - close_issues_start))"
          echo "close_resolved_issues=${close_issues_duration}" >> runtime-metrics/classify-stage-durations.env
          if [ "${close_issues_exit}" -ne 0 ]; then
            exit "${close_issues_exit}"
          fi

      - name: Evaluate CI-5 classify-drift runtime budgets
        id: runtime-budget
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          stage_file = Path("runtime-metrics/classify-stage-durations.env")
          stage_durations: dict[str, int] = {}
          for raw_line in stage_file.read_text(encoding="utf-8").splitlines():
              line = raw_line.strip()
              if not line:
                  continue
              stage_id, raw_duration = line.split("=", 1)
              stage_durations[stage_id] = int(raw_duration)

          metrics = {
              "workflow_id": "ci-5-classify-drift",
              "stage_durations_seconds": stage_durations,
          }
          Path("runtime-metrics/classify-runtime-metrics.json").write_text(
              json.dumps(metrics, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          python3 -m scripts.validation.evaluate_runtime_budget \
            --metrics runtime-metrics/classify-runtime-metrics.json \
            --report runtime-metrics/classify-runtime-budget-report.json \
            --budget-config schema/runtime-budgets.json

      - name: Warn on CI-5 classify runtime budget breaches
        if: steps.runtime-budget.outputs.overall_status == 'warn'
        run: |
          set -euo pipefail
          echo "::warning::CI-5 classify-drift runtime budgets exceeded warn threshold(s). See runtime-metrics/classify-runtime-budget-report.json."

      - name: Upload CI-5 classify runtime budget artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ci5-classify-runtime-budget-${{ github.run_id }}
          path: |
            runtime-metrics/classify-stage-durations.env
            runtime-metrics/classify-runtime-metrics.json
            runtime-metrics/classify-runtime-budget-report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Fail on severe CI-5 classify runtime budget breach
        if: steps.runtime-budget.outputs.overall_status == 'fail'
        run: |
          set -euo pipefail
          echo "::error::CI-5 classify-drift runtime budgets exceeded fail threshold(s). See runtime-metrics/classify-runtime-budget-report.json."
          exit 1

  synthesize:
    name: CI-5 synthesize + open PR
    needs: [check-drift, fetch-and-update, classify-drift]
    # Only run AFK-classified drifts automatically; HITL drifts create Issues instead.
    if: needs.classify-drift.outputs.has_afk == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: protected-pr-write
    concurrency:
      group: kb-write-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    env:
      WRITE_ALLOWLIST: raw/assets/**,raw/github-sources/**,wiki/**
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -e . --quiet

      - name: Download AFK-classified entries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: drift-classification-${{ github.run_id }}

      - name: Download fetched assets and registry state
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: fetched-state-${{ github.run_id }}

      - name: Apply diff-aware wiki updates
        run: |
          set -euo pipefail
          mkdir -p runtime-metrics
          synthesize_start="$(date -u +%s)"
          # IMPORTANT: Only process AFK-classified entries, not the full drift report.
          # The full drift-report.json includes HITL entries that must NOT be auto-synthesized.
          python -m scripts.github_monitor.synthesize_diff \
            --drift-report afk-entries.json \
            --apply
          synthesize_end="$(date -u +%s)"
          synthesize_duration="$((synthesize_end - synthesize_start))"

          SYNTHESIZE_DURATION="${synthesize_duration}" python3 - <<'PY' > runtime-metrics/synthesize-runtime-metrics.json
          import json
          import os

          payload = {
              "workflow_id": "ci-5-synthesize",
              "stage_durations_seconds": {
                  "synthesize_diff": int(os.environ["SYNTHESIZE_DURATION"]),
              },
          }
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Evaluate CI-5 synthesize runtime budgets
        id: runtime-budget
        run: |
          set -euo pipefail
          python3 -m scripts.validation.evaluate_runtime_budget \
            --metrics runtime-metrics/synthesize-runtime-metrics.json \
            --report runtime-metrics/synthesize-runtime-budget-report.json \
            --budget-config schema/runtime-budgets.json

      - name: Warn on CI-5 synthesize runtime budget breaches
        if: steps.runtime-budget.outputs.overall_status == 'warn'
        run: |
          set -euo pipefail
          echo "::warning::CI-5 synthesize runtime budgets exceeded warn threshold(s). See runtime-metrics/synthesize-runtime-budget-report.json."

      - name: Upload CI-5 synthesize runtime budget artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ci5-synthesize-runtime-budget-${{ github.run_id }}
          path: |
            runtime-metrics/synthesize-runtime-metrics.json
            runtime-metrics/synthesize-runtime-budget-report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Fail on severe CI-5 synthesize runtime budget breach
        if: steps.runtime-budget.outputs.overall_status == 'fail'
        run: |
          set -euo pipefail
          echo "::error::CI-5 synthesize runtime budgets exceeded fail threshold(s). See runtime-metrics/synthesize-runtime-budget-report.json."
          exit 1

      - name: Commit and open PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH="github-monitor/sync-${{ github.run_id }}"
          git checkout -b "${BRANCH}"

          # Stage only the allowlisted paths.
          git add raw/assets/ raw/github-sources/ wiki/
          git diff --cached --quiet && echo "Nothing to commit" && exit 0

          git commit -m "chore(github-monitor): sync monitored source(s) [run ${{ github.run_id }}]"

          git push origin "HEAD:${BRANCH}"

          gh pr create \
            --title "chore(github-monitor): sync monitored source(s)" \
            --body "Automated diff-aware sync by CI-5 GitHub source monitor (run ${{ github.run_id }})." \
            --base main \
            --head "${BRANCH}"
