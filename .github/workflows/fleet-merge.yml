# .github/workflows/fleet-merge.yml
#
# Event-driven fleet merge: fires when CI-2 completes rather than polling.
#
# ┌─ workflow_run: CI-2 completed ─────────────────────────────────────────────┐
# │  Conclusion != success → exit immediately (< 5s, no runner setup)          │
# │  No open fleet PR for this SHA → exit immediately                          │
# │  Fleet PR found + CI passed → update branch → squash merge                 │
# │  Conflict → close PR, re-dispatch Jules session (new PR will re-trigger)   │
# └────────────────────────────────────────────────────────────────────────────┘
#
# Using workflow_run instead of check_suite: completed ensures exactly one
# trigger fires per CI cycle (only CI-2, not every check suite), preventing
# the concurrency queue from overflowing and silently dropping the merge event.
#
# workflow_dispatch (manual sweep) is also available to process any open fleet
# PRs that currently have passing CI — useful after extended outages.
name: Fleet Sequential Merge

on:
  # Event-driven: fires only when CI-2 (the required check) completes.
  # Exactly one trigger per PR CI cycle — no queue overflow risk.
  workflow_run:
    workflows: ["CI-2 Analyst Read-Only Diagnostics"]
    types: [completed]
  # Manual sweep: process all open fleet PRs that currently have passing CI.
  workflow_dispatch:
    inputs:
      base_branch:
        description: "Base branch for merge"
        type: string
        default: "main"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: fleet-merge
  cancel-in-progress: false

jobs:
  # ── Event-driven path ───────────────────────────────────────────────────────
  # Exits immediately for non-fleet suites. For fleet PRs: merge on first pass.
  merge-on-ci-pass:
    if: |
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # JULES_API_KEY is scoped to the merge/re-dispatch step only — see below.
    steps:
      - name: Find open fleet PR for this commit
        id: find-pr
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # Cheap API call — exits fast for non-fleet suites (the common case).
          #
          # Two-identity login check (mirrors fleet-dispatch.yml's Phase 2a
          # filter): Jules's auth model shifted from bot-authored PRs
          # ('google-labs-jules') to PAT-based posting under the operator's
          # own login (github.repository_owner). Restricting to the bot
          # identity alone silently matches zero PRs post-shift — see
          # ADR-019 Consequences row 3 (issue #82 / #299 / #307 / #308).
          #
          # google-labs-jules-authored PRs are trusted on identity alone
          # (that login cannot be spoofed by another actor). Owner-authored
          # PRs are only trusted when the PR body matches the EXACT,
          # anchored footer Jules generates (see buildDispatchCommentBody in
          # scripts/fleet/fleet-dispatch.ts): "*PR created automatically by
          # Jules for task [<sessionId>](https://jules.google.com/task/
          # <sessionId>) started by @<repository_owner>*". A bare substring
          # test for the task-URL alone is spoofable (Codex finding on #566,
          # round 2) — any owner-authored PR that merely mentions a Jules
          # URL in unrelated discussion would otherwise pass. Cross-checking
          # the extracted session ID against .fleet/*/sessions.json is
          # unreliable as an additional gate: that file is only ever
          # committed to main by manual/historical commits, never by the
          # automated fleet-dispatch-after-merge.yml pipeline itself (which
          # runs bun fleet-dispatch.ts in an ephemeral runner working tree
          # and never commits/pushes the result) — so the automated PRs
          # this filter must recognize would always fail that lookup
          # (Codex finding on #566, round 3). The anchored footer format,
          # generated verbatim by Jules and tied to the actual
          # repository_owner login, is the authoritative signal instead.
          #
          # The match itself is fully line-anchored (`^...$` with the `m`
          # flag) and requires the opening `*`, so a PR merely quoting the
          # footer inline within other prose does not match — the footer
          # must occupy its own complete line, exactly as Jules renders it.
          # The session ID is captured once and backreferenced (`\k<sid>`)
          # so the link text and the URL segment must be the SAME value —
          # a forged `[fake](.../real-id)` cannot satisfy the match (Codex
          # finding on #566, round 4).
          #
          # `gh pr list --jq` accepts exactly one expression argument and
          # does not forward extra jq CLI flags (e.g. `--arg`) — piping to a
          # separate `jq --arg` invocation avoids unsafe shell interpolation
          # of $HEAD_SHA/$REPO_OWNER into the jq expression string.
          PR_NUM=$(gh pr list \
            --state open \
            --repo "$REPO" \
            --json number,headRefOid,author,body \
            | jq -r --arg sha "$HEAD_SHA" --arg owner "$REPO_OWNER" '
                ($owner | ascii_downcase) as $owner_lc
                | [.[] | select(.headRefOid == $sha) | select(
                    (.author.login == "google-labs-jules") or
                    (.author.login == $owner and
                      ((.body // "") | test(
                        "(?m)^\\*PR created automatically by Jules for task \\[(?<sid>[A-Za-z0-9_-]+)\\]\\(https://jules\\.google\\.com/task/\\k<sid>\\) started by @" + $owner_lc + "\\*$";
                        "i"
                      ))
                    )
                  ) | .number] | .[0] // empty
              ')
          if [ -z "$PR_NUM" ]; then
            echo "No open fleet PR for SHA ${HEAD_SHA}. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Fleet PR #${PR_NUM} found for SHA ${HEAD_SHA}."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "pr_num=${PR_NUM}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout (needed for fleet re-dispatch on conflict)
        if: steps.find-pr.outputs.skip == 'false'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Bun
        if: steps.find-pr.outputs.skip == 'false'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.1"

      - name: Cache Bun dependencies
        if: steps.find-pr.outputs.skip == 'false'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('scripts/fleet/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install fleet dependencies
        if: steps.find-pr.outputs.skip == 'false'
        working-directory: scripts/fleet
        run: bun install

      # Issue #310 / ADR-036 / Issue #385: mint a fleet-orchestrator App
      # installation token. When present, Phase 3 merges fire downstream push
      # workflows that GITHUB_TOKEN-authored merges would silently suppress
      # (Layer 6 trap). Detect+mint extracted to composite per #385.
      - name: Mint fleet-orchestrator App token
        id: app-token
        if: steps.find-pr.outputs.skip == 'false'
        uses: ./.github/actions/fleet-orchestrator-token
        with:
          app-id: ${{ secrets.FLEET_APP_ID }}
          private-key: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Update branch and merge
        if: steps.find-pr.outputs.skip == 'false'
        env:
          # Issue #310 / ADR-036: prefer fleet-orchestrator App token so the
          # squash-merge fires downstream push workflows. Falls back to
          # GITHUB_TOKEN when the App is not provisioned.
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ steps.find-pr.outputs.pr_num }}
          REPO: ${{ github.repository }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: |
          set -euo pipefail

          echo "🔄 Updating branch for PR #${PR_NUM}..."
          UPDATE_OUTPUT=$(gh pr update-branch "$PR_NUM" --rebase 2>&1) || true

          if echo "$UPDATE_OUTPUT" | grep -qi "conflict\|cannot be rebased"; then
            echo "⚠️ Conflict on PR #${PR_NUM}. Closing and re-dispatching..."

            # Recover original task prompt from fleet data; fall back to PR body.
            SESSION_ID=$(gh pr view "$PR_NUM" --json body -q '.body' \
              | grep -oE 'https://jules\.google\.com/task/[A-Za-z0-9_-]+' \
              | sed 's|.*/||' || true)
            FLEET_DIR=$(find .fleet -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort | tail -1 || true)
            TASK_PROMPT=""
            if [ -n "$SESSION_ID" ] && [ -n "$FLEET_DIR" ]; then
              TASK_ID=$(jq -r --arg sid "$SESSION_ID" \
                '.[] | select(.sessionId == $sid) | .taskId // empty' \
                "${FLEET_DIR%/}/sessions.json" 2>/dev/null || true)
              [ -n "$TASK_ID" ] && TASK_PROMPT=$(jq -r --arg tid "$TASK_ID" \
                '.tasks[] | select(.id == $tid) | .prompt // empty' \
                "${FLEET_DIR%/}/issue_tasks.json" 2>/dev/null || true)
            fi
            [ -z "$TASK_PROMPT" ] && TASK_PROMPT=$(gh pr view "$PR_NUM" --json body -q '.body')

            # Recover base branch before closing — gh pr view works on open PRs.
            PR_BASE=$(gh pr view "$PR_NUM" --json baseRefName -q '.baseRefName')
            # Re-dispatch BEFORE closing: if bun fails, set -e stops here and the
            # original PR remains open rather than being permanently lost.
            JULES_REPO="${REPO}" TASK_PROMPT="${TASK_PROMPT}" JULES_BASE_BRANCH="${PR_BASE}" bun -e "
              import { jules } from '@google/jules-sdk';
              const run = await jules.run({
                prompt: process.env.TASK_PROMPT,
                source: { github: process.env.JULES_REPO, baseBranch: process.env.JULES_BASE_BRANCH },
              });
              console.log('Re-dispatched session:', run.id);
            "
            # Only close after the re-dispatch succeeds (no task loss on bun failure).
            gh pr close "$PR_NUM" \
              --comment "⚠️ Closed by fleet-merge: conflict after rebase. Task re-dispatched — new PR will auto-merge when its CI passes."
            echo "✅ Re-dispatched. New PR will trigger this workflow when its CI passes."
            exit 0
          fi

          # CI already passed — that is what triggered this workflow.
          # Merge immediately without any polling.
          if gh pr merge "$PR_NUM" --squash; then
            echo "🎉 PR #${PR_NUM} merged."
          else
            echo "❌ Merge failed for PR #${PR_NUM}."
            exit 1
          fi

  # ── Manual sweep path ───────────────────────────────────────────────────────
  # Triggered by workflow_dispatch. Merges all fleet PRs whose CI currently
  # passes. PRs with pending CI are skipped (event-driven path handles them).
  manual-sweep:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # JULES_API_KEY is scoped to the merge/re-dispatch step only — see below.
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.1"

      - name: Cache Bun dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('scripts/fleet/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install fleet dependencies
        working-directory: scripts/fleet
        run: bun install

      # Issue #310 / ADR-036 / Issue #385: mint a fleet-orchestrator App token
      # so manual-sweep merges fire downstream push workflows (Layer 6 trap).
      # Detect+mint extracted to composite per #385.
      - name: Mint fleet-orchestrator App token
        id: app-token
        uses: ./.github/actions/fleet-orchestrator-token
        with:
          app-id: ${{ secrets.FLEET_APP_ID }}
          private-key: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Merge all fleet PRs with passing CI
        env:
          # Pass workflow inputs through env vars to avoid shell injection
          # (never interpolate ${{ inputs.* }} directly into run: blocks).
          INPUT_BASE_BRANCH: ${{ inputs.base_branch }}
          REPO: ${{ github.repository }}
          REPO_OWNER: ${{ github.repository_owner }}
          # Issue #310 / ADR-036: prefer fleet-orchestrator App token so merges
          # fire downstream push workflows; fall back to GITHUB_TOKEN.
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          # JULES_API_KEY scoped to this step only — not needed for checkout/install.
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: |
          set -euo pipefail

          BASE_BRANCH="${INPUT_BASE_BRANCH:-main}"
          echo "🔍 Finding open Jules-authored PRs targeting ${BASE_BRANCH}..."

          # Two-identity login check (mirrors fleet-dispatch.yml's Phase 2a
          # filter and the find-pr step above): Jules's auth model shifted
          # from bot-authored PRs ('google-labs-jules') to PAT-based posting
          # under the operator's own login (github.repository_owner).
          # Restricting to the bot identity alone silently matches zero PRs
          # post-shift — see ADR-019 Consequences row 3 (issue #82 / #299 /
          # #307 / #308).
          #
          # Cross-checking against .fleet/*/sessions.json was considered
          # and rejected: that file is only ever committed to main by
          # manual/historical commits, never by the automated
          # fleet-dispatch-after-merge.yml pipeline itself, so real
          # automation-generated PRs would always fail that lookup (Codex
          # finding on #566, round 3).
          #
          # The match is fully line-anchored (`^...$` with the `m` flag)
          # and requires the opening `*`, so a PR merely quoting the footer
          # inline within other prose does not match. The session ID is
          # captured once and backreferenced (`\k<sid>`) so the link text
          # and URL segment must be the SAME value — a forged
          # `[fake](.../real-id)` cannot satisfy the match (Codex finding
          # on #566, round 4).
          #
          # `gh pr list --jq` takes exactly one expression argument and does
          # not forward extra jq CLI flags like `--arg` — pipe to a separate
          # `jq --arg` invocation instead of passing `--arg` to `--jq`.
          PRS=$(gh pr list \
            --state open \
            --base "$BASE_BRANCH" \
            --json number,headRefName,author,body \
            | jq -r --arg owner "$REPO_OWNER" '
                ($owner | ascii_downcase) as $owner_lc
                | [.[] | select(
                    (.author.login == "google-labs-jules") or
                    (.author.login == $owner and
                      ((.body // "") | test(
                        "(?m)^\\*PR created automatically by Jules for task \\[(?<sid>[A-Za-z0-9_-]+)\\]\\(https://jules\\.google\\.com/task/\\k<sid>\\) started by @" + $owner_lc + "\\*$";
                        "i"
                      ))
                    )
                  )] | sort_by(.number) | .[].number
              ')

          if [ -z "$PRS" ]; then
            echo "ℹ️  No Jules-authored PRs found."
            exit 0
          fi

          PR_COUNT=$(echo "$PRS" | wc -l | tr -d ' ')
          echo "Found ${PR_COUNT} Jules PR(s)."

          for PR_NUM in $PRS; do
            echo ""
            echo "📦 PR #${PR_NUM}..."

            # Check current merge state — skip PRs with pending or failing CI.
            # The event-driven path will handle them when their CI passes.
            MERGE_STATE=$(gh pr view "$PR_NUM" --json mergeStateStatus --jq '.mergeStateStatus' 2>/dev/null || echo "UNKNOWN")
            echo "  Merge state: ${MERGE_STATE}"
            if [ "$MERGE_STATE" != "CLEAN" ] && [ "$MERGE_STATE" != "HAS_HOOKS" ]; then
              echo "  ⏭️  Skipping — not ready (${MERGE_STATE}). Event-driven path will pick it up."
              continue
            fi

            UPDATE_OUTPUT=$(gh pr update-branch "$PR_NUM" --rebase 2>&1) || true
            if echo "$UPDATE_OUTPUT" | grep -qi "conflict\|cannot be rebased"; then
              echo "  ⚠️ Conflict on PR #${PR_NUM}. Re-dispatching..."

              SESSION_ID=$(gh pr view "$PR_NUM" --json body -q '.body' \
                | grep -oE 'https://jules\.google\.com/task/[A-Za-z0-9_-]+' \
                | sed 's|.*/||' || true)
              FLEET_DIR=$(find .fleet -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort | tail -1 || true)
              TASK_PROMPT=""
              if [ -n "$SESSION_ID" ] && [ -n "$FLEET_DIR" ]; then
                TASK_ID=$(jq -r --arg sid "$SESSION_ID" \
                  '.[] | select(.sessionId == $sid) | .taskId // empty' \
                  "${FLEET_DIR%/}/sessions.json" 2>/dev/null || true)
                [ -n "$TASK_ID" ] && TASK_PROMPT=$(jq -r --arg tid "$TASK_ID" \
                  '.tasks[] | select(.id == $tid) | .prompt // empty' \
                  "${FLEET_DIR%/}/issue_tasks.json" 2>/dev/null || true)
              fi
              [ -z "$TASK_PROMPT" ] && TASK_PROMPT=$(gh pr view "$PR_NUM" --json body -q '.body')

              # Re-dispatch BEFORE closing (same durability reason as merge-on-ci-pass:
              # if bun fails, set -e stops here and the PR stays open, no task loss).
              JULES_REPO="${REPO}" TASK_PROMPT="${TASK_PROMPT}" JULES_BASE_BRANCH="${BASE_BRANCH}" bun -e "
                import { jules } from '@google/jules-sdk';
                const run = await jules.run({
                  prompt: process.env.TASK_PROMPT,
                  source: { github: process.env.JULES_REPO, baseBranch: process.env.JULES_BASE_BRANCH },
                });
                console.log('Re-dispatched:', run.id);
              "
              # Only close after re-dispatch succeeds.
              gh pr close "$PR_NUM" \
                --comment "⚠️ Closed by fleet-merge (manual sweep): conflict. Task re-dispatched."
              continue
            fi

            if gh pr merge "$PR_NUM" --squash; then
              echo "  🎉 PR #${PR_NUM} merged."
              sleep 3
            else
              echo "  ❌ Merge failed for PR #${PR_NUM}."
              exit 1
            fi
          done

          echo ""
          echo "✅ Manual sweep complete."
