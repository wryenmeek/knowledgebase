# .github/workflows/fleet-plan.yml
#
# Phase 1 of the fleet pipeline (runs on schedule, ~2 min):
#   1. Creates a Jules planning session via fleet-plan.ts.
#   2. Writes the session ID to .fleet/.pending_session and pushes to main.
#
# Phase 2 (fleet-dispatch.yml) is triggered by pull_request: opened and picks
# up when Jules posts the planning PR — no polling required.
name: Fleet Plan

on:
  schedule:
    # Runs daily at 6am UTC
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      base_branch:
        description: "Base branch for Jules sessions"
        type: string
        default: "main"

permissions:
  contents: write

concurrency:
  group: fleet-plan
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ inputs.base_branch || 'main' }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.1"

      - name: Install fleet dependencies
        working-directory: scripts/fleet
        run: bun install

      - name: Create planning session
        id: plan
        working-directory: scripts/fleet
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FLEET_BASE_BRANCH: ${{ inputs.base_branch || 'main' }}
        # Writes plan_session_id to GITHUB_OUTPUT.
        run: bun fleet-plan.ts

      - name: Store pending session ID
        env:
          BASE_BRANCH: ${{ inputs.base_branch || 'main' }}
          PLAN_SESSION_ID: ${{ steps.plan.outputs.plan_session_id }}
          FLEET_DATE: ${{ steps.plan.outputs.fleet_date }}
        run: |
          set -euo pipefail
          if [ -z "$PLAN_SESSION_ID" ]; then
            echo "❌ PLAN_SESSION_ID is empty — fleet-plan.ts did not export a session ID." >&2
            exit 1
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Push to fleet-state branch (unprotected) — avoids main branch protection rules.
          if git fetch origin fleet-state 2>/dev/null; then
            git checkout -B fleet-state origin/fleet-state
          else
            git checkout --orphan fleet-state
          fi
          mkdir -p .fleet
          # Line 1: session ID, Line 2: base branch, Line 3: fleet date (YYYY_MM_DD).
          # fleet-dispatch reads line 3 so it finds the right dated directory even
          # if Jules takes more than a day to post its planning PR.
          printf '%s\n%s\n%s\n' "$PLAN_SESSION_ID" "$BASE_BRANCH" "$FLEET_DATE" > .fleet/.pending_session
          git add -f .fleet/.pending_session
          git commit -m "chore(fleet): store pending planning session $PLAN_SESSION_ID"
          git push origin fleet-state
          echo "✅ Session $PLAN_SESSION_ID (date: $FLEET_DATE) stored in fleet-state branch."
