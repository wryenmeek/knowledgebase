name: Wiki Freshness Check

on:
  schedule:
    - cron: "30 3 * * 1" # Monday 03:30 UTC
  workflow_dispatch:
    inputs:
      enforcement_mode:
        description: "Whether freshness failures block the run (signal=advisory, blocking=hard-fail)"
        type: choice
        options:
          - signal
          - blocking
        default: signal

permissions:
  contents: read

# CI permission policy markers (machine-checked by test_ci_permission_asserts.py)
env:
  CI_ID: CI-freshness
  TOKEN_PROFILE: tp-freshness-readonly
  FRESHNESS_MAX_AGE_DAYS: "90"
  FRESHNESS_NEAR_EXPIRY_DAYS: "14"

concurrency:
  group: kb-freshness-${{ github.repository }}
  cancel-in-progress: true

jobs:
  wiki-freshness:
    name: Wiki freshness analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ENFORCEMENT_MODE: ${{ inputs.enforcement_mode || 'signal' }}
    steps:
      - name: Checkout repository snapshot
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Run wiki freshness check
        # Governed constants: freshness_stale_days, see docs/architecture.md
        id: freshness
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p freshness-reports
          python3 -m scripts.validation.check_doc_freshness \
            --scope wiki \
            --as-of "$(date -u +%Y-%m-%d)" \
            --max-age-days "$FRESHNESS_MAX_AGE_DAYS" \
            --failures-only \
            > freshness-reports/wiki-freshness.json

      - name: Annotate stale pages
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          if [[ ! -f freshness-reports/wiki-freshness.json ]]; then
            echo "No freshness report generated."
            exit 0
          fi
          python3 - <<'EOF'
          import sys
          from scripts.validation.github_actions_annotations import (
              escape_message,
              escape_property,
              load_report_entries,
          )

          try:
              files = load_report_entries("freshness-reports/wiki-freshness.json", "files")
          except ValueError as exc:
              print(f"::warning::freshness report missing or malformed: {exc}")
              sys.exit(0)
          if not files:
              print("All wiki pages are within the freshness threshold.")
              sys.exit(0)
          for entry in files:
              path = escape_property(str(entry.get("path", "unknown")))
              msg = escape_message(str(entry.get("message", "stale document")))
              print(f"::warning file={path}::{msg} FIX: update page content and set updated_at to today's date in the YAML frontmatter.")
          EOF

      - name: Classify stale pages for routing
        # Governed constants: freshness_afk_threshold_days=180, see docs/architecture.md
        if: always()
        run: |
          set -euo pipefail
          if [[ ! -f freshness-reports/wiki-freshness.json ]]; then
            echo '{"stale_pages":[]}' > freshness-reports/freshness-routing.json
            exit 0
          fi
          python3 -m scripts.validation.classify_stale \
            --freshness-report freshness-reports/wiki-freshness.json \
            --output freshness-reports/freshness-routing.json \
            --afk-threshold-days 180

      - name: Advisory governance signal sweep
        continue-on-error: true  # advisory; crashes must not fail the scheduled run
        run: |
          set -euo pipefail
          mkdir -p freshness-reports
          python3 .github/skills/validate-wiki-governance/logic/validate_wiki_governance.py \
            --mode signal \
            --quiet \
            --validator sourceref-shape \
            --validator page-template \
            --validator append-only-log \
            --validator topology-hygiene \
            --validator freshness-threshold \
            > freshness-reports/governance-signal.json
          python3 - <<'EOF'
          import sys
          from scripts.validation.github_actions_annotations import (
              escape_message,
              escape_property,
              load_report_entries,
          )

          try:
              findings = load_report_entries("freshness-reports/governance-signal.json", "findings")
          except ValueError as exc:
              print(f"::warning::governance report missing or malformed: {exc}")
              sys.exit(0)
          fail_findings = [fn for fn in findings if fn.get("status") == "fail"]
          if not fail_findings:
              print("Governance signal sweep: no advisory findings.")
              sys.exit(0)
          for fn in fail_findings:
              target = escape_property(str(fn.get("target", "wiki")))
              msg = escape_message(str(fn.get("message", "governance finding")))
              validator = escape_message(str(fn.get("validator", "governance")))
              print(f"::warning file={target}::[{validator}] {msg} (advisory — signal mode)")
          EOF

      - name: Run wiki near-expiry check
        # Keep the advisory signal running when an earlier advisory step fails.
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p freshness-reports
          python3 -m scripts.validation.check_doc_freshness \
            --scope wiki \
            --as-of "$(date -u +%Y-%m-%d)" \
            --max-age-days "$FRESHNESS_MAX_AGE_DAYS" \
            --near-expiry-days "$FRESHNESS_NEAR_EXPIRY_DAYS" \
            --failures-only \
            > freshness-reports/wiki-near-expiry.json

      - name: Annotate near-expiry pages
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          if [[ ! -f freshness-reports/wiki-near-expiry.json ]]; then
            echo "No near-expiry report generated."
            exit 0
          fi
          python3 - <<'PY'
          import sys
          from scripts.validation.github_actions_annotations import (
              escape_message,
              escape_property,
              load_report_entries,
          )

          try:
              files = load_report_entries("freshness-reports/wiki-near-expiry.json", "files")
          except ValueError as exc:
              print(f"::warning::near-expiry report missing or malformed: {exc}")
              sys.exit(0)

          for entry in files:
              if not isinstance(entry, dict) or entry.get("reason_code") != "near_expiry":
                  continue
              path = escape_property(str(entry.get("path", "unknown")))
              message = escape_message(str(entry.get("message", "near expiry")))
              print(f"::warning file={path}::{message}")
          PY

      - name: Upload freshness report artifact
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: wiki-freshness-${{ github.run_id }}
          path: freshness-reports/
          if-no-files-found: warn
          retention-days: 30

      - name: Fail on stale wiki pages (blocking mode only)
        if: env.ENFORCEMENT_MODE == 'blocking' && steps.freshness.outcome == 'failure'
        run: |
          set -euo pipefail
          echo "::error::Wiki freshness check failed in blocking mode. Review the uploaded freshness report artifact." >&2
          exit 1
