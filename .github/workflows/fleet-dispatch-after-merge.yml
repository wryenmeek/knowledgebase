# .github/workflows/fleet-dispatch-after-merge.yml
#
# Phase 2b of the fleet pipeline (event-driven, ~3 min):
#   Triggered when a planning artifact lands on main (typically from
#   Phase 2a's queued auto-merge of the Jules planning PR). Detects the
#   newly-added .fleet/<date>/issue_tasks.json, cross-checks against the
#   pending session in fleet-state, then:
#     1. Clears .fleet/.pending_session from fleet-state so the next plan
#        cycle starts clean.
#     2. Pulls the freshly merged main with the planning artifacts.
#     3. Runs fleet-dispatch.ts to spawn one Jules agent session per task.
#
# Why this is split from fleet-dispatch.yml (Phase 2a):
#   Branch protection on main requires the CI-2 diagnostics check to pass
#   before merge, but CI-2 takes ~90s while the planning-PR-opened event
#   fires immediately. Earlier the merge step ran synchronously and raced
#   (and lost) to CI-2, silently failing every dispatch. The two-phase
#   split lets Phase 2a queue an auto-merge and exit, while this workflow
#   waits for the actual `push` event when the merge finally lands.
#
# Trigger correctness notes:
#   - `push: branches: [main]` with the path filter narrows the trigger
#     surface so non-planning pushes don't spin up the runner.
#   - The first step still cross-checks the actually-added file against
#     fleet-state's pending_date — direct push of a planning-artifact-shaped
#     file (e.g., a manual revert/cherry-pick) won't trigger dispatch unless
#     the date matches the active pending session.
#   - If fleet-state has no pending session, the workflow exits cleanly.
#     This covers the case where a planning PR was merged manually after
#     fleet-state was cleared, or where this workflow is re-run on an
#     older push event.
#   - `workflow_dispatch` is the operator escape hatch. It exists because
#     GitHub suppresses `push` event workflow runs when the push was
#     authored by GITHUB_TOKEN (e.g., Phase 2a's `gh pr merge --auto` from
#     within Actions). Phase 2b therefore won't auto-fire on every
#     planning-PR merge until Phase 2a switches to a non-GITHUB_TOKEN
#     identity (GitHub App token recommended — see Issue #310, Layer 6).
#     Until then, an operator runs `gh workflow run
#     fleet-dispatch-after-merge.yml --ref main` after the planning PR
#     auto-merges, and the same detect/cross-check/dispatch path runs as
#     for a normal push.
name: Fleet Dispatch After Merge

on:
  push:
    branches: [main]
    paths:
      - ".fleet/*/issue_tasks.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fleet-dispatch-after-merge
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: main
          # fetch-depth: 2 lets us diff HEAD vs HEAD~1 to detect what landed.
          fetch-depth: 2

      - name: Detect newly-added planning artifact
        id: detect
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # workflow_dispatch (operator escape hatch): skip the HEAD~1 diff
            # because intervening commits on main may have landed between the
            # planning PR merge and the operator triggering this workflow.
            # Resolve the artifact via fleet-state's pending_date and verify
            # the file exists on main — that's the security guard that
            # replaces the diff-based detection for this code path.
            git fetch origin fleet-state 2>/dev/null || true
            if ! git rev-parse origin/fleet-state >/dev/null 2>&1; then
              echo "ℹ️  workflow_dispatch: no fleet-state branch. Cannot resolve pending_date. Skipping."
              echo "is_planning_merge=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            PENDING_DATA=$(git show origin/fleet-state:.fleet/.pending_session 2>/dev/null || echo "")
            if [ -z "$PENDING_DATA" ]; then
              echo "ℹ️  workflow_dispatch: no pending session in fleet-state. Nothing to dispatch."
              echo "is_planning_merge=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            DETECTED_DATE=$(printf '%s' "$PENDING_DATA" | sed -n '3p' | tr -d '\r')
            if [ -z "$DETECTED_DATE" ]; then
              echo "ℹ️  workflow_dispatch: fleet-state pending_session missing date. Skipping."
              echo "is_planning_merge=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Validate detected date is YYYY_MM_DD shape to keep the path
            # construction safe from injection via fleet-state mutation.
            # Anchored regex (^...$) is load-bearing — a weakened pattern
            # would let DETECTED_DATE="2020_01_01_../../etc" slip past and
            # build ".fleet/2020_01_01_../../etc/issue_tasks.json". The
            # file-existence check below is a backstop, not a substitute.
            if ! printf '%s' "$DETECTED_DATE" | grep -qE '^[0-9]{4}_[0-9]{2}_[0-9]{2}$'; then
              echo "⚠️  workflow_dispatch: fleet-state pending_date ($DETECTED_DATE) is not YYYY_MM_DD (also check for stray CRLF). Refusing to dispatch."
              echo "is_planning_merge=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            ARTIFACT_PATH=".fleet/${DETECTED_DATE}/issue_tasks.json"
            if [ ! -f "$ARTIFACT_PATH" ]; then
              echo "ℹ️  workflow_dispatch: planning artifact $ARTIFACT_PATH not present on main. Skipping."
              echo "is_planning_merge=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "✅ workflow_dispatch: planning artifact $ARTIFACT_PATH found (date=$DETECTED_DATE)"
            {
              echo "is_planning_merge=true"
              echo "detected_date=$DETECTED_DATE"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # push event: use the original diff-based detection. List files added
          # in this push (compared to HEAD~1). The path filter on the trigger
          # already narrowed us here, but we re-check against the exact pattern
          # so a touched (not added) tasks file doesn't re-fire dispatch on
          # subsequent pushes.
          ADDED=$(git diff --name-only --diff-filter=A HEAD~1 HEAD \
            | grep -E '^\.fleet/[0-9_]+/issue_tasks\.json$' || true)
          if [ -z "$ADDED" ]; then
            echo "ℹ️  No new planning artifact added in this push. Skipping."
            echo "is_planning_merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # If multiple planning artifacts landed in one push (unusual but
          # possible for a manual import), take the first one and let
          # the cross-check against fleet-state's pending_date confirm it.
          ARTIFACT_PATH=$(echo "$ADDED" | head -1)
          DETECTED_DATE=$(echo "$ARTIFACT_PATH" | sed -nE 's|^\.fleet/([0-9_]+)/.*|\1|p')
          echo "✅ Planning artifact landed: $ARTIFACT_PATH (date=$DETECTED_DATE)"
          {
            echo "is_planning_merge=true"
            echo "detected_date=$DETECTED_DATE"
          } >> "$GITHUB_OUTPUT"

      - name: Read pending session info from fleet-state
        if: steps.detect.outputs.is_planning_merge == 'true'
        id: session
        env:
          # SECURITY: route detect-step output through env: rather than inline
          # ${{ ... }} substitution in run:. Currently safe because detected_date
          # is validated against ^[0-9]{4}_[0-9]{2}_[0-9]{2}$ on both event paths,
          # but the inline substitution is performed before the shell parses
          # the line, so any future weakening of the upstream regex becomes a
          # quote-escape injection. env-routing matches the dispatch step's
          # documented pattern (and the AGENTS.md guidance under "GitHub Actions
          # shell injection guard"). Cross-functional security review of Layers
          # 6-8 (2026-06-20).
          DETECTED_DATE: ${{ steps.detect.outputs.detected_date }}
        run: |
          set -euo pipefail
          if ! git fetch origin fleet-state; then
            echo "⚠️  fetch of fleet-state failed; treating as absent (no dispatch this cycle)."
            echo "have_session=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git rev-parse origin/fleet-state >/dev/null 2>&1; then
            echo "ℹ️  No fleet-state branch. Cannot resolve base branch. Skipping."
            echo "have_session=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PENDING_DATA=$(git show origin/fleet-state:.fleet/.pending_session 2>/dev/null || echo "")
          if [ -z "$PENDING_DATA" ]; then
            echo "ℹ️  No pending session in fleet-state. The planning PR may have been merged manually or in a prior cycle. Skipping dispatch."
            echo "have_session=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PENDING_SESSION_ID=$(printf '%s' "$PENDING_DATA" | sed -n '1p' | tr -d '\r')
          PENDING_BASE=$(printf '%s' "$PENDING_DATA" | sed -n '2p' | tr -d '\r')
          PENDING_DATE_STATE=$(printf '%s' "$PENDING_DATA" | sed -n '3p' | tr -d '\r')

          # SECURITY: PENDING_BASE flows downstream into the dispatch step as
          # FLEET_BASE_BRANCH and is consumed by a fast-forward fetch of that
          # ref. The git option-parsing terminator on that fetch blocks
          # git-flag injection, but does NOT prevent the value from being a
          # perfectly valid refspec pointing at an attacker-controlled branch.
          # If that branch is a fast-forward descendant of main, the fetch
          # succeeds and the runner ends up executing attacker code (with
          # JULES_API_KEY and GITHUB_TOKEN in env) on the dispatch step.
          #
          # fleet-state is an unprotected branch — anyone with repo-write
          # access can mutate it. So we enforce that PENDING_BASE is exactly
          # "main" (the documented protected branch the planning artifact
          # always lands on). This is stricter than a regex shape check and
          # closes the entire refspec-substitution class.
          #
          # If a future operating mode genuinely needs a non-main base, replace
          # this hard pin with a regex shape check plus an allowlist (see
          # cross-functional security review of Layers 6-8, 2026-06-20).
          if [ "$PENDING_BASE" != "main" ]; then
            echo "⚠️  fleet-state pending_base ($PENDING_BASE) is not 'main'. Refusing to dispatch — only 'main' is allowed as the fleet base branch."
            echo "have_session=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Cross-check: the detected planning artifact's date must match
          # fleet-state's pending_date. On the push event path this catches
          # drift between what landed on main and what fleet-state expects
          # (manual import / replay attempts). On the workflow_dispatch path
          # both values trace back to fleet-state's pending_date, so this
          # comparison is structurally identical and only verifies internal
          # consistency — the load-bearing guards on that path are the
          # artifact file-existence check in the detect step and the
          # PENDING_BASE pin above.
          if [ "$PENDING_DATE_STATE" != "$DETECTED_DATE" ]; then
            echo "⚠️  fleet-state pending_date ($PENDING_DATE_STATE) does not match detected planning artifact date ($DETECTED_DATE). Skipping dispatch to avoid ambiguity."
            echo "have_session=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "✅ Pending session: $PENDING_SESSION_ID, base: $PENDING_BASE, date: $PENDING_DATE_STATE"
          {
            echo "have_session=true"
            echo "pending_session=$PENDING_SESSION_ID"
            echo "pending_base=$PENDING_BASE"
            echo "pending_date=$PENDING_DATE_STATE"
          } >> "$GITHUB_OUTPUT"

      - name: Clear pending session file
        if: steps.session.outputs.have_session == 'true'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B fleet-state origin/fleet-state
          # .fleet/** is gitignored on the working tree (so dated planning
          # subdirs Jules writes locally don't accidentally leak in via
          # `git add .`). But .fleet/.pending_session IS tracked on the
          # fleet-state branch — it's the control-plane file we need to
          # delete here. `git rm` operates on tracked entries in the index
          # and is unaffected by .gitignore matching, so it's the correct
          # primitive for staging a tracked-but-ignored deletion. (`git add
          # <ignored-path>` would error with "path is ignored" — observed
          # 2026-06-20 during the first end-to-end Phase 2b run, see Layer 7
          # in Issue #82's diagnostic trail.)
          if git ls-files --error-unmatch .fleet/.pending_session >/dev/null 2>&1; then
            git rm .fleet/.pending_session
            git commit -m "chore(fleet): clear pending session after planning PR merged"
            git push origin fleet-state
          else
            echo "Nothing to clear in fleet-state (.fleet/.pending_session not tracked)."
          fi
          # Restore main for downstream steps. The dispatch step runs
          # `git pull --ff-only origin -- "$FLEET_BASE_BRANCH"` and reads
          # the planning artifact at `.fleet/<date>/issue_tasks.json` — both
          # require being on main. Without this restore the pull fails with
          # "fatal: Not possible to fast-forward, aborting" because
          # fleet-state and main are divergent branches (Layer 8 fix,
          # observed 2026-06-20 on the first end-to-end Phase 2b run).
          git checkout main

      - name: Setup Bun
        if: steps.session.outputs.have_session == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.1"

      - name: Install fleet dependencies
        if: steps.session.outputs.have_session == 'true'
        working-directory: scripts/fleet
        run: bun install

      - name: Dispatch task sessions
        if: steps.session.outputs.have_session == 'true'
        working-directory: scripts/fleet
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # SECURITY: pending_base (→ FLEET_BASE_BRANCH) originates from the
          # unprotected fleet-state branch. Use env-var indirection (same as
          # FLEET_PENDING_DATE) so GitHub Actions does not expand it before the
          # shell runs. The git pull uses -- to prevent flag injection.
          FLEET_BASE_BRANCH: ${{ steps.session.outputs.pending_base }}
          # SECURITY: pending_date is read from the unprotected fleet-state branch;
          # pass through env var to prevent shell injection via expression expansion.
          FLEET_PENDING_DATE: ${{ steps.session.outputs.pending_date }}
        run: |
          set -euo pipefail
          # Two paths reach this step:
          #   - push: the planning artifact landed on main as part of this
          #     very push, so the initial checkout SHA already contains it.
          #   - workflow_dispatch: intervening commits may have landed
          #     between the planning PR merge and the operator firing this
          #     workflow, so the initial checkout SHA is potentially behind
          #     origin/main.
          # The git pull below covers both — defensive on the push path,
          # load-bearing on the workflow_dispatch path. The session step has
          # already pinned PENDING_BASE to exactly "main", so the refspec is
          # known-safe at this point (not attacker-controlled). The --
          # terminator is retained as defense-in-depth in case the pinning
          # is ever relaxed.
          # SECURITY: -- terminates git option parsing so a crafted FLEET_BASE_BRANCH
          # (from unprotected fleet-state) cannot inject git flags like --upload-pack.
          git pull --ff-only origin -- "$FLEET_BASE_BRANCH"
          bun fleet-dispatch.ts
