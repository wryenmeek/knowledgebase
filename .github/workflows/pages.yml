name: Deploy Wiki to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "wiki/**"
      - "mkdocs.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: requirements-pages.txt

      - name: Install MkDocs Material
        run: pip install -r requirements-pages.txt

      - name: Bootstrap qmd preflight shim
        run: |
          mkdir -p .ci-bin .qmd/index
          cat > .ci-bin/qmd <<'EOF'
          #!/usr/bin/env sh
          set -eu
          exit 0
          EOF
          chmod +x .ci-bin/qmd

      - name: Run qmd preflight
        run: PATH="$PWD/.ci-bin:$PATH" python3 scripts/kb/qmd_preflight.py --repo-root .

      - name: Build MkDocs site
        run: mkdocs build --strict

      - name: Build Pagefind index
        run: npx --yes pagefind --site site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

