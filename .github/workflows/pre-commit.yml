name: Pre-commit hooks

# Runs all pre-commit hooks on push and PRs targeting main so that local
# governance guardrails are verified in CI as well as locally.

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  pre-commit:
    name: Run pre-commit hooks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install package and pre-commit
        run: |
          pip install --quiet ".[dev]" pre-commit

      - name: Fetch PR base branch for ratchet diff
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin -- "$BASE_REF:refs/remotes/origin/$BASE_REF"

      - name: Run pre-commit on all files
        # Skip the detect-secrets hook in CI — it requires a committed
        # .secrets.baseline and the hook re-scans all files. The baseline
        # is committed so drift is caught; a dedicated security scan can
        # run detect-secrets scan separately if desired.
        env:
          SKIP: detect-secrets
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_REF" ]; then
            export KB_TEST_FRAMEWORK_RATCHET_BASE_REF="origin/$BASE_REF"
          fi
          pre-commit run --all-files
