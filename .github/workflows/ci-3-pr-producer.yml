name: CI-3 PR Producer Write Path

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ci-3-pr-producer.yml
      - .github/skills/extract-entities-and-claims/**
      - .github/skills/validate-wiki-governance/**
      - .github/skills/synthesize-entity-page/**
      - .github/skills/synthesize-concept-page/**
  workflow_run:
    workflows:
      - CI-1 Gatekeeper Trusted Handoff
    types:
      - completed
  workflow_dispatch:
    inputs:
      maintainer_approved:
        description: Manual attestation flag for write-capable CI-3 dispatch; protected-environment reviewers enforce authoritative approval.
        required: true
        type: boolean
      source_path:
        description: Optional single source path under raw/inbox/** for manual runs.
        required: false
        type: string

permissions:
  actions: read
  checks: read
  contents: read

concurrency:
  group: kb-write-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: CI-3 preflight (tp-pr-producer)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI_ID: CI-3
      TOKEN_PROFILE: tp-pr-producer
      WRITE_ALLOWLIST: wiki/**,wiki/index.md,wiki/log.md,raw/processed/**,raw/rejected/**
      FALLBACK_MANUAL_INSTRUCTIONS: Follow SPEC.md fallback/manual execution path and open a PR through required checks.
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout workflow context
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Assert CI-3 preflight prerequisites
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_APPROVED: ${{ github.event.inputs.maintainer_approved || 'false' }}
          DISPATCH_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WORKFLOW_RUN_NAME: ${{ github.event.workflow_run.name || '' }}
          WORKFLOW_RUN_EVENT: ${{ github.event.workflow_run.event || '' }}
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
          WORKFLOW_FILE: .github/workflows/ci-3-pr-producer.yml
        run: |
          set -euo pipefail

          reason_list=()
          prereq_ghaw_readiness="PASS"
          prereq_trusted_trigger_model="PASS"
          prereq_permissions_scope="PASS"
          prereq_concurrency_guard="PASS"
          prereq_fallback_manual_path="PASS"

          if [[ "${CI_ID}" != "CI-3" ]] || [[ "${TOKEN_PROFILE}" != "tp-pr-producer" ]]; then
            reason_list+=("reject:permissions_scope:token_profile_mismatch")
            prereq_permissions_scope="FAIL"
          fi

          if ! command -v python3 >/dev/null 2>&1; then
            reason_list+=("prereq_missing:ghaw_readiness:python3_unavailable")
            prereq_ghaw_readiness="FAIL"
          fi

          if ! command -v gh >/dev/null 2>&1; then
            reason_list+=("prereq_missing:ghaw_readiness:gh_cli_unavailable")
            prereq_ghaw_readiness="FAIL"
          fi

          for required_file in scripts/kb/ingest.py scripts/kb/update_index.py scripts/kb/lint_wiki.py scripts/kb/persist_query.py "${WORKFLOW_FILE}"; do
            if [[ ! -f "${required_file}" ]]; then
              reason_list+=("prereq_missing:ghaw_readiness:missing_${required_file//\//_}")
              prereq_ghaw_readiness="FAIL"
            fi
          done

          if [[ "${EVENT_NAME}" == "workflow_run" ]]; then
            if [[ "${WORKFLOW_RUN_NAME}" != "CI-1 Gatekeeper Trusted Handoff" ]]; then
              reason_list+=("reject:trusted_trigger_model:unexpected_handoff_workflow")
              prereq_trusted_trigger_model="FAIL"
            fi
            if [[ "${WORKFLOW_RUN_EVENT}" != "push" ]]; then
              reason_list+=("reject:trusted_trigger_model:workflow_run_event_not_push")
              prereq_trusted_trigger_model="FAIL"
            fi
            if [[ "${WORKFLOW_RUN_CONCLUSION}" != "success" ]]; then
              reason_list+=("reject:trusted_trigger_model:upstream_ci1_not_success")
              prereq_trusted_trigger_model="FAIL"
            fi
          elif [[ "${EVENT_NAME}" == "push" ]]; then
            # Infrastructure validation: direct push to main for CI-3 control-plane changes.
            # Allowed paths: .github/workflows/ci-3-*, .github/skills/validate-wiki-governance/**, etc.
            set +e
            # For push events, get changes since previous commit (HEAD~1...HEAD)
            git diff --name-only -z "HEAD~1" HEAD > /tmp/push_diff 2>/dev/null
            push_diff_exit=$?
            set -e
            if [[ "${push_diff_exit}" -ne 0 ]]; then
              reason_list+=("prereq_missing:ghaw_readiness:push_changed_paths_unavailable")
              prereq_ghaw_readiness="FAIL"
            else
              push_changed_paths=()
              while IFS= read -r -d '' changed_path || [[ -n "${changed_path:-}" ]]; do
                [[ -n "${changed_path}" ]] && push_changed_paths+=("${changed_path}")
              done < /tmp/push_diff
              mapfile -t push_changed_paths < <(printf '%s\n' "${push_changed_paths[@]}" | sed '/^$/d' | sort -u)
                
              if [[ "${#push_changed_paths[@]}" -eq 0 ]]; then
                reason_list+=("reject:path_filter:no_changed_paths_detected")
                prereq_trusted_trigger_model="FAIL"
              fi

              # Only allow CI-3 infrastructure changes (not inbox, not most control-plane)
              allowed_push_paths=()
              for changed_path in "${push_changed_paths[@]}"; do
                case "${changed_path}" in
                  .github/workflows/ci-3-*|.github/skills/extract-entities-and-claims/**|.github/skills/validate-wiki-governance/**|.github/skills/synthesize-entity-page/**|.github/skills/synthesize-concept-page/**)
                    allowed_push_paths+=("${changed_path}")
                    ;;
                  *)
                    reason_list+=("reject:path_filter:disallowed_push_path:${changed_path}")
                    prereq_trusted_trigger_model="FAIL"
                    ;;
                esac
              done

              if [[ "${#allowed_push_paths[@]}" -eq 0 ]] && [[ "${#push_changed_paths[@]}" -gt 0 ]]; then
                reason_list+=("reject:trusted_trigger_model:push_paths_not_ci3_infrastructure")
                prereq_trusted_trigger_model="FAIL"
              fi
            fi
            rm -f /tmp/push_diff || true
          elif [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${MANUAL_APPROVED}" != "true" ]]; then
              reason_list+=("reject:trusted_trigger_model:manual_approval_required")
              prereq_trusted_trigger_model="FAIL"
            fi

            if [[ -z "${DISPATCH_SHA}" ]]; then
              reason_list+=("prereq_missing:ghaw_readiness:missing_dispatch_sha")
              prereq_ghaw_readiness="FAIL"
            else
              set +e
              dispatch_merge_base="$(git merge-base "origin/${DEFAULT_BRANCH}" "${DISPATCH_SHA}" 2>/dev/null)"
              dispatch_merge_base_exit=$?
              set -e
              if [[ "${dispatch_merge_base_exit}" -ne 0 ]] || [[ -z "${dispatch_merge_base}" ]]; then
                reason_list+=("prereq_missing:ghaw_readiness:dispatch_merge_base_unavailable")
                prereq_ghaw_readiness="FAIL"
              else
                dispatch_diff_file="$(mktemp)"
                set +e
                git diff --name-only -z "${dispatch_merge_base}" "${DISPATCH_SHA}" > "${dispatch_diff_file}" 2>/dev/null
                dispatch_diff_exit=$?
                set -e
              fi
              if [[ "${prereq_ghaw_readiness}" == "FAIL" ]]; then
                :
              elif [[ "${dispatch_diff_exit}" -ne 0 ]]; then
                reason_list+=("prereq_missing:ghaw_readiness:dispatch_changed_paths_unavailable")
                prereq_ghaw_readiness="FAIL"
              else
                dispatch_changed_paths=()
                while IFS= read -r -d '' changed_path || [[ -n "${changed_path:-}" ]]; do
                  [[ -n "${changed_path}" ]] && dispatch_changed_paths+=("${changed_path}")
                done < "${dispatch_diff_file}"
                mapfile -t dispatch_changed_paths < <(printf '%s\n' "${dispatch_changed_paths[@]}" | sed '/^$/d' | sort -u)
                if [[ "${#dispatch_changed_paths[@]}" -eq 0 ]]; then
                  reason_list+=("reject:path_filter:no_changed_paths_detected")
                  prereq_trusted_trigger_model="FAIL"
                fi

                sensitive_dispatch_paths=()
                for changed_path in "${dispatch_changed_paths[@]}"; do
                  case "${changed_path}" in
                    .github/workflows/*|.github/skills/*|.github/agents/*|.github/extensions/*|scripts/*|schema/*|AGENTS.md|pyproject.toml)
                      sensitive_dispatch_paths+=("${changed_path}")
                      reason_list+=("reject:path_filter:sensitive_control_plane_path:${changed_path}")
                      ;;
                  esac
                done

                if [[ "${#sensitive_dispatch_paths[@]}" -gt 0 ]]; then
                  reason_list+=("reject:trusted_trigger_model:manual_dispatch_sensitive_paths_present")
                  prereq_trusted_trigger_model="FAIL"
                fi
              fi
              if [[ -n "${dispatch_diff_file:-}" ]]; then
                rm -f "${dispatch_diff_file}" || true
              fi
            fi
          else
            reason_list+=("reject:trusted_trigger_model:event_not_allowed")
            prereq_trusted_trigger_model="FAIL"
          fi

          mapfile -t permissions_contract_errors < <(python3 - "${WORKFLOW_FILE}" <<'PY'
          import sys
          from pathlib import Path

          workflow_file = Path(sys.argv[1])
          expected_top_level_permissions = {
              "actions": "read",
              "checks": "read",
              "contents": "read",
          }
          expected_synthesis_curator_permissions = {
              "actions": "read",
              "checks": "read",
              "contents": "read",
              "models": "read",
          }
          expected_pr_producer_permissions = {
              "actions": "read",
              "checks": "read",
              "contents": "write",
              "pull-requests": "write",
          }

          workflow_lines = workflow_file.read_text(encoding="utf-8").splitlines()
          errors = []


          def parse_mapping_block(block_start: int, indent: int, scope: str) -> dict[str, str]:
              entries = []
              expected_prefix = " " * indent
              nested_prefix = expected_prefix + "  "
              for candidate in workflow_lines[block_start + 1 :]:
                  stripped = candidate.strip()
                  if not stripped:
                      continue
                  if stripped.startswith("#"):
                      continue
                  if not candidate.startswith(expected_prefix) or candidate.startswith(nested_prefix):
                      break
                  if ":" not in stripped:
                      errors.append(f"reject:permissions_scope:permissions_entry_malformed:{scope}")
                      continue
                  map_key, map_value = stripped.split(":", 1)
                  entries.append((map_key.strip(), map_value.strip()))

              mapping: dict[str, str] = {}
              duplicate_keys = set()
              for map_key, map_value in entries:
                  if map_key in mapping:
                      duplicate_keys.add(map_key)
                  mapping[map_key] = map_value

              for duplicate_key in sorted(duplicate_keys):
                  errors.append(f"reject:permissions_scope:permissions_key_duplicated:{scope}:{duplicate_key}")

              return mapping


          def validate_permissions(actual: dict[str, str], expected: dict[str, str], scope: str) -> None:
              missing_keys = sorted(set(expected) - set(actual))
              unexpected_keys = sorted(set(actual) - set(expected))
              mismatched_values = sorted(
                  map_key
                  for map_key, expected_value in expected.items()
                  if map_key in actual and actual[map_key] != expected_value
              )

              for missing_key in missing_keys:
                  errors.append(f"reject:permissions_scope:permissions_key_missing:{scope}:{missing_key}")
              for unexpected_key in unexpected_keys:
                  errors.append(f"reject:permissions_scope:permissions_key_unexpected:{scope}:{unexpected_key}")
              for mismatched_key in mismatched_values:
                  errors.append(
                      "reject:permissions_scope:permissions_value_mismatch:"
                      f"{scope}:{mismatched_key}:expected_{expected[mismatched_key]}:"
                      f"actual_{actual[mismatched_key]}"
                  )


          top_level_permissions_indices = [
              index
              for index, workflow_line in enumerate(workflow_lines)
              if workflow_line.strip() == "permissions:" and not workflow_line.startswith(" ")
          ]
          if not top_level_permissions_indices:
              errors.append("reject:permissions_scope:permissions_block_missing:top_level")
          elif len(top_level_permissions_indices) > 1:
              errors.append("reject:permissions_scope:permissions_block_duplicated:top_level")
          else:
              top_level_permissions = parse_mapping_block(
                  top_level_permissions_indices[0],
                  indent=2,
                  scope="top_level",
              )
              validate_permissions(top_level_permissions, expected_top_level_permissions, "top_level")

          def validate_job_permissions(
              *,
              job_name: str,
              scope: str,
              expected_permissions: dict[str, str],
          ) -> None:
              job_header = f"{job_name}:"
              job_indices = [
                  index
                  for index, workflow_line in enumerate(workflow_lines)
                  if workflow_line.strip() == job_header
                  and workflow_line.startswith("  ")
                  and not workflow_line.startswith("    ")
              ]
              if not job_indices:
                  errors.append(f"reject:permissions_scope:{scope}_job_missing")
                  return
              if len(job_indices) > 1:
                  errors.append(f"reject:permissions_scope:{scope}_job_duplicated")
                  return

              job_start = job_indices[0]
              job_permissions_indices = []
              for index in range(job_start + 1, len(workflow_lines)):
                  candidate = workflow_lines[index]
                  stripped = candidate.strip()
                  if not stripped:
                      continue
                  if not candidate.startswith("    "):
                      break
                  if stripped == "permissions:" and candidate.startswith("    ") and not candidate.startswith("      "):
                      job_permissions_indices.append(index)

              if not job_permissions_indices:
                  errors.append(f"reject:permissions_scope:permissions_block_missing:{scope}")
              elif len(job_permissions_indices) > 1:
                  errors.append(f"reject:permissions_scope:permissions_block_duplicated:{scope}")
              else:
                  actual_permissions = parse_mapping_block(
                      job_permissions_indices[0],
                      indent=6,
                      scope=scope,
                  )
                  validate_permissions(
                      actual_permissions,
                      expected_permissions,
                      scope,
                  )

          validate_job_permissions(
              job_name="synthesis-curator",
              scope="synthesis_curator",
              expected_permissions=expected_synthesis_curator_permissions,
          )
          validate_job_permissions(
              job_name="pr-producer",
              scope="pr_producer",
              expected_permissions=expected_pr_producer_permissions,
          )

          if errors:
              print("\n".join(errors))
          PY
          )
          if [[ "${#permissions_contract_errors[@]}" -gt 0 ]]; then
            reason_list+=("reject:permissions_scope:minimum_permissions_mismatch")
            for permissions_contract_error in "${permissions_contract_errors[@]}"; do
              reason_list+=("${permissions_contract_error}")
            done
            prereq_permissions_scope="FAIL"
          fi

          if grep -Eiq '^[[:space:]][[:space:]](issues|packages|id-token|security-events|statuses|attestations|deployments)[[:space:]]*:[[:space:]]*write[[:space:]]*$' "${WORKFLOW_FILE}"; then
            reason_list+=("reject:permissions_scope:forbidden_write_scope_declared")
            prereq_permissions_scope="FAIL"
          fi

          if ! grep -Eq 'WRITE_ALLOWLIST:[[:space:]]*wiki/\*\*,wiki/index\.md,wiki/log\.md,raw/processed/\*\*,raw/rejected/\*\*' "${WORKFLOW_FILE}"; then
            reason_list+=("reject:permissions_scope:write_allowlist_mismatch")
            prereq_permissions_scope="FAIL"
          fi

          if ! grep -Eq '^[[:space:]][[:space:]]group:[[:space:]]*kb-write-\$\{\{ github\.repository \}\}-\$\{\{ github\.ref \}\}[[:space:]]*$' "${WORKFLOW_FILE}"; then
            reason_list+=("prereq_missing:concurrency_guard:missing_kb_write_group")
            prereq_concurrency_guard="FAIL"
          fi

          if ! grep -Eq '^[[:space:]][[:space:]]cancel-in-progress:[[:space:]]*false[[:space:]]*$' "${WORKFLOW_FILE}"; then
            reason_list+=("prereq_missing:concurrency_guard:cancel_in_progress_mismatch")
            prereq_concurrency_guard="FAIL"
          fi

          if [[ -z "${FALLBACK_MANUAL_INSTRUCTIONS}" ]]; then
            reason_list+=("prereq_missing:fallback_manual_path")
            prereq_fallback_manual_path="FAIL"
          fi

          {
            echo "ghaw_readiness=${prereq_ghaw_readiness}"
            echo "trusted_trigger_model=${prereq_trusted_trigger_model}"
            echo "permissions_scope=${prereq_permissions_scope}"
            echo "concurrency_guard=${prereq_concurrency_guard}"
            echo "fallback_manual_path=${prereq_fallback_manual_path}"
          } >> "${GITHUB_OUTPUT}"

          if [[ "${#reason_list[@]}" -gt 0 ]]; then
            for reason in "${reason_list[@]}"; do
              echo "::error::CI-3 preflight rejection reason=${reason}" >&2
              case "${reason}" in
                reject:permissions_scope:token_profile_mismatch)
                  echo "::notice::FIX: ensure this workflow uses the tp-pr-producer token profile. Check the TOKEN_PROFILE env var." ;;
                prereq_missing:ghaw_readiness:python3_unavailable)
                  echo "::notice::FIX: ensure Python 3.12+ is available in the CI runner environment." ;;
                prereq_missing:ghaw_readiness:gh_cli_unavailable)
                  echo "::notice::FIX: the GitHub CLI (gh) must be available in the runner. It is pre-installed on ubuntu-latest." ;;
                prereq_missing:ghaw_readiness:missing_dispatch_sha)
                  echo "::notice::FIX: workflow_dispatch preflight requires a dispatch commit SHA (github.sha). Re-run from a concrete branch commit." ;;
                prereq_missing:ghaw_readiness:dispatch_merge_base_unavailable)
                  echo "::notice::FIX: CI-3 could not resolve a merge-base between the dispatch SHA and origin/${DEFAULT_BRANCH}. Ensure checkout history includes the branch context." ;;
                prereq_missing:ghaw_readiness:dispatch_changed_paths_unavailable)
                  echo "::notice::FIX: CI-3 could not resolve changed paths for the dispatch commit. Ensure checkout history includes the commit context." ;;
                prereq_missing:ghaw_readiness:missing_*)
                  echo "::notice::FIX: a required file referenced in the reason code is missing from the repository. Add it before proceeding." ;;
                reject:trusted_trigger_model:unexpected_handoff_workflow)
                  echo "::notice::FIX: CI-3 must be triggered by the CI-1 gatekeeper workflow_run event. Check the on.workflow_run.workflows setting." ;;
                reject:trusted_trigger_model:upstream_ci1_not_success)
                  echo "::notice::FIX: the upstream CI-1 gatekeeper must have completed successfully before CI-3 can run." ;;
                reject:trusted_trigger_model:manual_approval_required)
                  echo "::notice::FIX: workflow_dispatch runs require a manual protected-environment approval (ci3-manual-approval environment)." ;;
                reject:path_filter:no_changed_paths_detected)
                  echo "::notice::FIX: manual dispatch must resolve changed paths for the selected commit. Re-run against a commit with concrete file changes." ;;
                reject:path_filter:sensitive_control_plane_path:*)
                  echo "::notice::FIX: manual workflow_dispatch cannot run when commit includes sensitive control-plane paths (.github/workflows/**, .github/skills/**, .github/agents/**, .github/extensions/**, scripts/**, schema/**, AGENTS.md, pyproject.toml)." ;;
                reject:trusted_trigger_model:manual_dispatch_sensitive_paths_present)
                  echo "::notice::FIX: split sensitive control-plane changes from manual CI-3 dispatch commits; process source-only changes through CI-3." ;;
                reject:permissions_scope:minimum_permissions_mismatch | reject:permissions_scope:forbidden_write_scope_declared | reject:permissions_scope:write_allowlist_mismatch)
                  echo "::notice::FIX: review the permissions block in this workflow. Only allowlisted write scopes are permitted." ;;
                prereq_missing:concurrency_guard:*)
                  echo "::notice::FIX: the concurrency block is missing or misconfigured. Ensure group and cancel-in-progress match the expected values." ;;
              esac
            done
            exit 1
          fi

          echo "CI-3 preflight PASS: trusted handoff/manual approval + tp-pr-producer checks satisfied."

  manual-approval:
    name: CI-3 manual protected-environment approval
    if: github.event_name == 'workflow_dispatch'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: ci3-manual-approval
    steps:
      - name: Display approval checklist
        run: |
          set -euo pipefail
          cat <<'EOF'
          ┌─────────────────────────────────────────────────────────────────┐
          │  CI-3 MANUAL DISPATCH — APPROVAL CHECKLIST                      │
          ├─────────────────────────────────────────────────────────────────┤
          │                                                                 │
          │  You are being asked to approve because this CI-3 run was       │
          │  triggered manually (workflow_dispatch), bypassing CI-1's        │
          │  automated gatekeeper. Without CI-1, there is no trusted         │
          │  validation that the source material is safe to process.         │
          │                                                                 │
          │  Before approving, verify ALL of the following:                  │
          │                                                                 │
          │  1. SOURCE LEGITIMACY                                           │
          │     - The source file(s) under raw/inbox/ are authentic and      │
          │       were placed there intentionally by an authorized person    │
          │                                                                 │
          │  2. PATH SAFETY                                                 │
          │     - The source_path input (if provided) points to a real       │
          │       file under raw/inbox/ — not a symlink or path traversal    │
          │                                                                 │
          │  3. NO SENSITIVE CONTROL PLANE CHANGES                          │
          │     - Preflight hard-blocks workflow_dispatch runs when          │
          │       the dispatch commit includes .github/workflows/**,         │
          │       .github/skills/**, .github/agents/**, .github/extensions/**,│
          │       scripts/**, schema/**, AGENTS.md, or pyproject.toml        │
          │     - If blocked, split those control-plane edits into a         │
          │       separate commit/PR and re-run CI-3 on source-only changes  │
          │                                                                 │
          │  4. PREFLIGHT PASSED                                            │
          │     - The preflight job above shows green (PASS)                 │
          │     - Review any ::notice:: annotations for warnings             │
          │                                                                 │
          │  5. WRITE SCOPE IS BOUNDED                                      │
          │     - CI-3 will only write to: wiki/**, raw/processed/**,        │
          │       raw/rejected/** — confirm this is acceptable               │
          │                                                                 │
          │  If ANY check fails, REJECT this deployment.                     │
          │  The source can be re-processed via the normal CI-1 path.        │
          └─────────────────────────────────────────────────────────────────┘
          EOF
      - name: Confirm protected-environment approval
        run: |
          set -euo pipefail
          echo "CI-3 manual dispatch approved via protected environment reviewers."

  synthesis-curator:
    name: CI-3 synthesis extraction (tp-pr-producer)
    needs:
      - preflight
      - manual-approval
    if: ${{ always() && needs.preflight.result == 'success' && (github.event_name != 'workflow_dispatch' || needs.manual-approval.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      checks: read
      contents: read
      models: read
    env:
      CI_ID: CI-3
      TOKEN_PROFILE: tp-pr-producer
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout trusted source revision
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Resolve CI-3 source inputs
        id: sources
        env:
          MANUAL_SOURCE_PATH: ${{ github.event.inputs.source_path || '' }}
        run: |
          set -euo pipefail

          repo_root="$(realpath .)"
          inbox_root="$(realpath raw/inbox)"
          mapfile -t source_paths < <(find raw/inbox -type f ! -name '.gitkeep' ! -name '.ci3-ingest-manifest' | sort)

          if [[ -n "${MANUAL_SOURCE_PATH}" ]]; then
            if [[ "${MANUAL_SOURCE_PATH}" != raw/inbox/* ]]; then
              echo "::error::reject:path_filter:outside_raw_inbox:${MANUAL_SOURCE_PATH}" >&2
              exit 1
            fi
            if [[ ! -f "${MANUAL_SOURCE_PATH}" ]]; then
              echo "::error::reject:path_filter:missing_manual_source:${MANUAL_SOURCE_PATH}" >&2
              exit 1
            fi
            if [[ -L "${MANUAL_SOURCE_PATH}" ]]; then
              echo "::error::reject:path_filter:manual_source_symlink:${MANUAL_SOURCE_PATH}" >&2
              exit 1
            fi
            manual_resolved="$(realpath "${MANUAL_SOURCE_PATH}")"
            if [[ "${manual_resolved}" != "${inbox_root}/"* ]]; then
              echo "::error::reject:path_filter:outside_raw_inbox:${MANUAL_SOURCE_PATH}" >&2
              exit 1
            fi
            if [[ "${manual_resolved}" != "${repo_root}/"* ]]; then
              echo "::error::reject:path_filter:outside_repo_root:${MANUAL_SOURCE_PATH}" >&2
              exit 1
            fi
            manual_relative="${manual_resolved#"${repo_root}/"}"
            source_paths=("${manual_relative}")
          fi

          if [[ "${#source_paths[@]}" -eq 0 ]]; then
            echo "has_sources=false" >> "${GITHUB_OUTPUT}"
            echo "No raw/inbox sources found; CI-3 synthesis extraction is a no-op."
            exit 0
          fi

          for source_path in "${source_paths[@]}"; do
            if [[ "${source_path}" != raw/inbox/* ]]; then
              echo "::error::reject:path_filter:outside_raw_inbox:${source_path}" >&2
              exit 1
            fi
            source_resolved="$(realpath "${source_path}")"
            if [[ "${source_resolved}" != "${inbox_root}/"* ]]; then
              echo "::error::reject:path_filter:outside_raw_inbox:${source_path}" >&2
              exit 1
            fi
          done

          printf '%s\n' "${source_paths[@]}" > raw/inbox/.ci3-ingest-manifest
          echo "has_sources=true" >> "${GITHUB_OUTPUT}"

      - name: Build CI-3 extraction bundles
        id: extract-bundles
        if: steps.sources.outputs.has_sources == 'true'
        env:
          SYNTHESIS_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p ci3-synthesis
          : > ci3-synthesis/extraction-bundles.tsv

          extract_json_field() {
            local field_name="$1"
            python3 -c $'import json, sys\nfield = sys.argv[1]\npayload = sys.stdin.read().strip()\ntry:\n    value = json.loads(payload).get(field, "")\nexcept Exception:\n    value = ""\nprint("" if value is None else value)' "${field_name}"
          }

          echo "[CI-3] ingest --sources-manifest raw/inbox/.ci3-ingest-manifest (extraction prep)"
          set +e
          ingest_json="$(python3 -m scripts.kb.ingest \
            --sources-manifest raw/inbox/.ci3-ingest-manifest \
            --batch-policy continue_and_report_per_source \
            --wiki-root wiki \
            --schema AGENTS.md \
            --report-json)"
          ingest_exit=$?
          set -e
          rm -f raw/inbox/.ci3-ingest-manifest || true

          echo "${ingest_json}"
          if [[ "${ingest_exit}" -ne 0 ]]; then
            ingest_reason="$(printf '%s' "${ingest_json}" | extract_json_field reason_code)"
            if [[ "${ingest_reason}" == "lock_unavailable" ]]; then
              echo "::error::CI-3 ingest failed closed during extraction prep (reason_code=lock_unavailable)." >&2
            else
              echo "::error::CI-3 ingest failed closed during extraction prep (exit=${ingest_exit}, reason_code=${ingest_reason:-unknown})." >&2
            fi
            exit 1
          fi

          written_source_pages=()
          while IFS= read -r written_page; do
            [[ -n "${written_page}" ]] && written_source_pages+=("${written_page}")
          done < <(printf '%s' "${ingest_json}" | python3 -c $'import json,sys\nd=json.load(sys.stdin)\nfor s in d.get("per_source",[]):\n    if s.get("status")=="written" and s.get("source_page"):\n        print(s["source_page"])' 2>/dev/null || true)

          if [[ "${#written_source_pages[@]}" -eq 0 ]]; then
            echo "has_bundles=false" >> "${GITHUB_OUTPUT}"
            echo "No written source pages available for extraction bundles."
            exit 0
          fi

          bundle_count=0
          for source_page in "${written_source_pages[@]}"; do
            safe_source="$(printf '%s' "${source_page}" | sed 's#[^A-Za-z0-9._-]#_#g')"
            source_hash="$(printf '%s' "${source_page}" | sha256sum | awk '{print $1}')"
            bundle_file="${safe_source}-${source_hash:0:12}.bundle.json"
            bundle_path="ci3-synthesis/${bundle_file}"

            set +e
            python3 .github/skills/extract-entities-and-claims/logic/extract_entities.py \
              --source-page "${source_page}" \
              --wiki-root wiki \
              --output "${bundle_path}"
            extract_exit=$?
            set -e

            if [[ "${extract_exit}" -ne 0 ]]; then
              echo "::warning::Synthesis extraction failed for ${source_page}; skipping bundle." >&2
              rm -f "${bundle_path}" || true
              continue
            fi

            printf '%s\t%s\n' "${source_page}" "${bundle_file}" >> ci3-synthesis/extraction-bundles.tsv
            bundle_count="$((bundle_count + 1))"
          done

          if [[ "${bundle_count}" -gt 0 ]]; then
            echo "has_bundles=true" >> "${GITHUB_OUTPUT}"
            echo "Prepared ${bundle_count} extraction bundle(s) for CI-3 write stage."
          else
            echo "has_bundles=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::No extraction bundles were produced; write stage synthesis will be skipped." >&2
          fi

      - name: Upload CI-3 extraction bundles
        if: always() && steps.sources.outputs.has_sources == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ci3-extraction-bundles-${{ github.run_id }}
          path: ci3-synthesis/
          if-no-files-found: error
          retention-days: 14

      - name: Record CI-3 synthesis no-op state
        if: steps.sources.outputs.has_sources != 'true'
        run: |
          set -euo pipefail
          echo "CI-3 synthesis extraction completed with no sources."

  pr-producer:
    name: CI-3 produce/update PR (tp-pr-producer)
    needs:
      - preflight
      - manual-approval
      - synthesis-curator
    if: ${{ always() && needs.preflight.result == 'success' && needs.synthesis-curator.result == 'success' && (github.event_name != 'workflow_dispatch' || needs.manual-approval.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      checks: read
      contents: write
      pull-requests: write
    env:
      CI_ID: CI-3
      TOKEN_PROFILE: tp-pr-producer
      WRITE_ALLOWLIST: wiki/**,wiki/index.md,wiki/log.md,raw/processed/**,raw/rejected/**
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout trusted source revision
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Install pinned qmd runtime
        run: |
          set -euo pipefail
          QMD_NPM_PACKAGE="@tobilu/qmd"
          QMD_VERSION="2.5.1"
          QMD_EXPECTED_INTEGRITY="sha512-Ep9ccOj1bNRinfTIszp5UZP8xfi5AJNtmzwWDD4ZVm2YdWVS+rFobWJQovj0HD2uIAFrryvbSpZYeGa3flEO7g==" # pragma: allowlist secret
          QMD_DIST_INTEGRITY="$(npm view "${QMD_NPM_PACKAGE}@${QMD_VERSION}" dist.integrity --registry=https://registry.npmjs.org)"
          if [ "${QMD_DIST_INTEGRITY}" != "${QMD_EXPECTED_INTEGRITY}" ]; then
            echo "::error::qmd dist.integrity mismatch (expected ${QMD_EXPECTED_INTEGRITY}, got ${QMD_DIST_INTEGRITY})" >&2
            exit 1
          fi
          npm install --global "${QMD_NPM_PACKAGE}@${QMD_VERSION}" --registry=https://registry.npmjs.org
          qmd init
          mkdir -p .qmd/index
          cp .qmd/index.sqlite .qmd/index/index.sqlite
          cp .qmd/index.yml .qmd/index/index.yml
          python3 scripts/kb/qmd_preflight.py --repo-root .

      - name: Run framework governance wrapper
        run: |
          set -euo pipefail
          python3 .github/skills/validate-wiki-governance/logic/validate_wiki_governance.py

      - name: Resolve CI-3 source inputs
        id: sources
        env:
          MANUAL_SOURCE_PATH: ${{ github.event.inputs.source_path || '' }}
        run: |
          set -euo pipefail

          repo_root="$(realpath .)"
          inbox_root="$(realpath raw/inbox)"
          mapfile -t source_paths < <(find raw/inbox -type f ! -name '.gitkeep' ! -name '.ci3-ingest-manifest' | sort)

          if [[ -n "${MANUAL_SOURCE_PATH}" ]]; then
            if [[ "${MANUAL_SOURCE_PATH}" != raw/inbox/* ]]; then
              echo "::error::reject:path_filter:outside_raw_inbox:${MANUAL_SOURCE_PATH}" >&2
              exit 1
            fi
            if [[ ! -f "${MANUAL_SOURCE_PATH}" ]]; then
              echo "::error::reject:path_filter:missing_manual_source:${MANUAL_SOURCE_PATH}" >&2
              exit 1
            fi
            if [[ -L "${MANUAL_SOURCE_PATH}" ]]; then
              echo "::error::reject:path_filter:manual_source_symlink:${MANUAL_SOURCE_PATH}" >&2
              exit 1
            fi
            manual_resolved="$(realpath "${MANUAL_SOURCE_PATH}")"
            if [[ "${manual_resolved}" != "${inbox_root}/"* ]]; then
              echo "::error::reject:path_filter:outside_raw_inbox:${MANUAL_SOURCE_PATH}" >&2
              exit 1
            fi
            if [[ "${manual_resolved}" != "${repo_root}/"* ]]; then
              echo "::error::reject:path_filter:outside_repo_root:${MANUAL_SOURCE_PATH}" >&2
              exit 1
            fi
            manual_relative="${manual_resolved#"${repo_root}/"}"
            source_paths=("${manual_relative}")
          fi

          if [[ "${#source_paths[@]}" -eq 0 ]]; then
            echo "has_sources=false" >> "${GITHUB_OUTPUT}"
            echo "No raw/inbox sources found; CI-3 write path is a no-op."
            exit 0
          fi

          for source_path in "${source_paths[@]}"; do
            if [[ "${source_path}" != raw/inbox/* ]]; then
              echo "::error::reject:path_filter:outside_raw_inbox:${source_path}" >&2
              exit 1
            fi
            source_resolved="$(realpath "${source_path}")"
            if [[ "${source_resolved}" != "${inbox_root}/"* ]]; then
              echo "::error::reject:path_filter:outside_raw_inbox:${source_path}" >&2
              exit 1
            fi
          done

          # Write source list to a workspace manifest file instead of GITHUB_OUTPUT
          # to avoid multiline output size limits (#15) and enable batch ingest (#14).
          printf '%s\n' "${source_paths[@]}" > raw/inbox/.ci3-ingest-manifest
          echo "has_sources=true" >> "${GITHUB_OUTPUT}"

      - name: Download CI-3 extraction bundles
        if: steps.sources.outputs.has_sources == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ci3-extraction-bundles-${{ github.run_id }}
          path: ci3-synthesis

      - name: Capture CI-3 pre-synthesis baseline
        if: steps.sources.outputs.has_sources == 'true'
        run: |
          set -euo pipefail
          # Capture working tree state before synthesis modifies files
          # We'll use this to validate only files actually written by CI-3
          git -c core.quotepath=false diff --name-status -z -- . > ci3-metrics/.baseline-git-diff.tsv 2>/dev/null || true
          git -c core.quotepath=false ls-files --others --exclude-standard -z -- . > ci3-metrics/.baseline-untracked.tsv 2>/dev/null || true
          echo "Baseline captured"

      - name: Run CI-3 required checks and write path
        id: write-path
        if: steps.sources.outputs.has_sources == 'true'
        run: |
          set -euo pipefail
          mkdir -p ci3-metrics

          extract_json_field() {
            local field_name="$1"
            python3 -c $'import json, sys\nfield = sys.argv[1]\npayload = sys.stdin.read().strip()\ntry:\n    value = json.loads(payload).get(field, "")\nexcept Exception:\n    value = ""\nprint("" if value is None else value)' "${field_name}"
          }

          # Batch ingest: single process invocation for all sources in the manifest
          # instead of one per source, eliminating repeated process startup and index
          # rebuild costs (#14). Manifest written by the previous step (#15).
          echo "[CI-3] ingest --sources-manifest raw/inbox/.ci3-ingest-manifest"
          ingest_start="$(date -u +%s)"
          set +e
          ingest_json="$(python3 -m scripts.kb.ingest \
            --sources-manifest raw/inbox/.ci3-ingest-manifest \
            --batch-policy continue_and_report_per_source \
            --wiki-root wiki \
            --schema AGENTS.md \
            --report-json)"
          ingest_exit=$?
          set -e
          ingest_end="$(date -u +%s)"
          ingest_duration="$((ingest_end - ingest_start))"
          rm -f raw/inbox/.ci3-ingest-manifest || true

          echo "${ingest_json}"
          if [[ "${ingest_exit}" -ne 0 ]]; then
            ingest_reason="$(printf '%s' "${ingest_json}" | extract_json_field reason_code)"
            if [[ "${ingest_reason}" == "lock_unavailable" ]]; then
              echo "::error::CI-3 ingest failed closed (reason_code=lock_unavailable)." >&2
            else
              echo "::error::CI-3 ingest failed closed (exit=${ingest_exit}, reason_code=${ingest_reason:-unknown})." >&2
            fi
            exit 1
          fi

          # Collect ALL written source page paths for synthesis stage (no break)
          written_source_pages=()
          while IFS= read -r written_page; do
            [[ -n "${written_page}" ]] && written_source_pages+=("${written_page}")
          done < <(printf '%s' "${ingest_json}" | python3 -c $'import json,sys\nd=json.load(sys.stdin)\nfor s in d.get("per_source",[]):\n    if s.get("status")=="written" and s.get("source_page"):\n        print(s["source_page"])' 2>/dev/null || true)

          # --- Synthesis Curator stage (artifact handoff) ---
          # Extraction bundles are produced in the low-privilege synthesis-curator
          # job and handed off via deterministic artifact files.
          bundle_manifest="ci3-synthesis/extraction-bundles.tsv"
          if [[ -s "${bundle_manifest}" ]] && [[ "${#written_source_pages[@]}" -gt 0 ]]; then
            echo "[CI-3] synthesis: applying extraction bundles from ${bundle_manifest}"
            while IFS=$'\t' read -r manifest_source_page manifest_bundle_file || [[ -n "${manifest_source_page:-}" || -n "${manifest_bundle_file:-}" ]]; do
              [[ -z "${manifest_source_page}" ]] && continue
              [[ -z "${manifest_bundle_file}" ]] && continue

              source_written="false"
              for written_source_page in "${written_source_pages[@]}"; do
                if [[ "${written_source_page}" == "${manifest_source_page}" ]]; then
                  source_written="true"
                  break
                fi
              done
              if [[ "${source_written}" != "true" ]]; then
                echo "::warning::Synthesis bundle source ${manifest_source_page} was not written in this run; skipping." >&2
                continue
              fi

              bundle_path="ci3-synthesis/${manifest_bundle_file}"
              if [[ ! -f "${bundle_path}" ]]; then
                echo "::warning::Synthesis bundle missing at ${bundle_path}; skipping ${manifest_source_page}." >&2
                continue
              fi

              set +e
              python3 .github/skills/synthesize-entity-page/logic/synthesize_combined.py \
                --extraction-bundle "${bundle_path}" \
                --wiki-root wiki
              synthesis_exit=$?
              set -e
              if [[ "${synthesis_exit}" -ne 0 ]]; then
                echo "::warning::Combined synthesis had errors for ${manifest_source_page}; continuing." >&2
              fi
            done < "${bundle_manifest}"
          elif [[ "${#written_source_pages[@]}" -gt 0 ]]; then
            echo "::warning::CI-3 synthesis bundle manifest missing or empty; skipping synthesis." >&2
          fi

          # update_index.main() acquires exclusive_write_lock internally —
          # do NOT wrap in an outer lock (flock is non-reentrant across fds).
          echo "[CI-3] update_index --write"
          index_start="$(date -u +%s)"
          set +e
          index_output="$(python3 -c 'import sys; from scripts.kb import update_index; sys.exit(update_index.main(["--wiki-root", "wiki", "--write"]))')"
          index_exit=$?
          set -e
          index_end="$(date -u +%s)"
          index_duration="$((index_end - index_start))"

          if [[ -n "${index_output}" ]]; then
            echo "${index_output}"
          fi
          if [[ "${index_exit}" -ne 0 ]]; then
            if [[ "${index_output}" == *"lock_unavailable"* ]]; then
              echo "::error::CI-3 index update failed closed (reason_code=lock_unavailable)." >&2
            else
              echo "::error::CI-3 index update failed closed (exit=${index_exit})." >&2
            fi
            exit 1
          fi

          echo "[CI-3] lint_wiki --strict"
          lint_start="$(date -u +%s)"
          python3 scripts/kb/lint_wiki.py --wiki-root wiki --strict
          lint_end="$(date -u +%s)"
          lint_duration="$((lint_end - lint_start))"

          echo "[CI-3] persist_query policy gate"
          persist_start="$(date -u +%s)"
          set +e
          persist_json="$(python3 -m scripts.kb.persist_query \
            --query "ci3 required-check policy probe" \
            --confidence 3 \
            --wiki-root wiki \
            --schema AGENTS.md \
            --result-json)"
          persist_exit=$?
          set -e
          persist_end="$(date -u +%s)"
          persist_duration="$((persist_end - persist_start))"

          echo "${persist_json}"
          if [[ "${persist_exit}" -ne 0 ]]; then
            persist_reason="$(printf '%s' "${persist_json}" | extract_json_field reason_code)"
            if [[ "${persist_reason}" == "lock_unavailable" ]]; then
              echo "::error::CI-3 persist_query failed closed (reason_code=lock_unavailable)." >&2
            else
              echo "::error::CI-3 persist_query failed closed (exit=${persist_exit}, reason_code=${persist_reason:-unknown})." >&2
            fi
            exit 1
          fi

          persist_status="$(printf '%s' "${persist_json}" | extract_json_field status)"
          if [[ "${persist_status}" != "written" ]] && [[ "${persist_status}" != "no_write_policy" ]]; then
            echo "::error::CI-3 persist_query returned disallowed status=${persist_status:-unknown}; expected written|no_write_policy." >&2
            exit 1
          fi

          INGEST_DURATION="${ingest_duration}" \
          INDEX_DURATION="${index_duration}" \
          LINT_DURATION="${lint_duration}" \
          PERSIST_DURATION="${persist_duration}" \
          python3 - <<'PY' > ci3-metrics/runtime-metrics.json
          import json
          import os

          payload = {
              "workflow_id": "ci-3-pr-producer",
              "stage_durations_seconds": {
                  "ingest_write_path": int(os.environ["INGEST_DURATION"]),
                  "update_index_write": int(os.environ["INDEX_DURATION"]),
                  "lint_wiki_strict": int(os.environ["LINT_DURATION"]),
                  "persist_query_gate": int(os.environ["PERSIST_DURATION"]),
              },
          }
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

          status_entries=()
          while IFS= read -r -d '' status_record || [[ -n "${status_record:-}" ]]; do
            [[ -n "${status_record}" ]] && status_entries+=("${status_record}")
          done < <(git -c core.quotepath=false diff --name-status -z --no-renames -- .)
          while IFS= read -r -d '' untracked_path || [[ -n "${untracked_path:-}" ]]; do
            [[ -n "${untracked_path}" ]] && status_entries+=("??"$'\t'"${untracked_path}")
          done < <(git -c core.quotepath=false ls-files --others --exclude-standard -z -- .)

          if [[ "${#status_entries[@]}" -eq 0 ]]; then
            echo "has_changes=false" >> "${GITHUB_OUTPUT}"
            echo "No repository changes detected after CI-3 write path."
            exit 0
          fi

          changed_paths=()
          allowlist_failures=()
          for status_entry in "${status_entries[@]}"; do
            status_code="${status_entry%%$'\t'*}"
            changed_path="${status_entry#*$'\t'}"
            [[ -z "${changed_path}" ]] && continue

            # Skip malformed status entries (missing tab separator)
            if [[ ! "${status_entry}" == *$'\t'* ]]; then
              continue
            fi

            if [[ "${changed_path}" == ci3-metrics/* ]]; then
              continue
            fi


            # CI-3 workspace transients (.qmd/, ci3-synthesis/, ci3-metrics/) are
            # never part of the governed write allowlist or PR payload.
            case "${changed_path}" in
              .qmd/*|ci3-synthesis/*|.baseline-*)
                continue
                ;;
            esac

            changed_paths+=("${changed_path}")

            if [[ "${status_code}" == *D* ]] && [[ "${changed_path}" == raw/inbox/* ]]; then
              continue
            fi

            # raw/inbox/** files are read-only inputs for CI-3, not write outputs
            # They should not be validated as part of the write allowlist
            if [[ "${changed_path}" == raw/inbox/* ]]; then
              continue
            fi

            case "${changed_path}" in
              wiki/*|raw/processed/*|raw/rejected/*)
                ;;
              *)
                allowlist_failures+=("${status_code}:${changed_path}")
                ;;
            esac
          done

          if [[ "${#allowlist_failures[@]}" -gt 0 ]]; then
            for rejected_path in "${allowlist_failures[@]}"; do
              echo "::error::reject:permissions_scope:out_of_allowlist_write:${rejected_path}" >&2
            done
            echo "::error::CI-3 write allowlist is restricted to ${WRITE_ALLOWLIST}." >&2
            exit 1
          fi

          if [[ "${#changed_paths[@]}" -eq 0 ]]; then
            echo "has_changes=false" >> "${GITHUB_OUTPUT}"
            echo "No allowlisted repository changes detected after CI-3 write path."
            exit 0
          fi

          mapfile -t changed_paths < <(printf '%s\n' "${changed_paths[@]}" | sed '/^$/d' | sort -u)
          echo "has_changes=true" >> "${GITHUB_OUTPUT}"
          _delim="$(openssl rand -hex 16)"
          {
            echo "changed_paths<<${_delim}"
            printf '%s\n' "${changed_paths[@]}"
            echo "${_delim}"
          } >> "${GITHUB_OUTPUT}"

      - name: Evaluate CI-3 runtime budgets
        id: runtime-budget
        if: steps.sources.outputs.has_sources == 'true'
        run: |
          set -euo pipefail
          python3 -m scripts.validation.evaluate_runtime_budget \
            --metrics ci3-metrics/runtime-metrics.json \
            --report ci3-metrics/runtime-budget-report.json \
            --budget-config schema/runtime-budgets.json

      - name: Warn on CI-3 runtime budget breaches
        if: steps.runtime-budget.outputs.overall_status == 'warn'
        run: |
          set -euo pipefail
          echo "::warning::CI-3 runtime budgets exceeded warn threshold(s). See ci3-metrics/runtime-budget-report.json and the step summary."

      - name: Upload CI-3 runtime budget artifacts
        if: always() && steps.sources.outputs.has_sources == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ci3-runtime-budget-${{ github.run_id }}
          path: |
            ci3-metrics/runtime-metrics.json
            ci3-metrics/runtime-budget-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Fail on severe CI-3 runtime budget breach
        if: steps.runtime-budget.outputs.overall_status == 'fail'
        run: |
          set -euo pipefail
          echo "::error::CI-3 runtime budgets exceeded fail threshold(s). See ci3-metrics/runtime-budget-report.json and the step summary."
          exit 1

      - name: Create or update CI-3 PR
        if: steps.write-path.outputs.has_changes == 'true'
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          CHANGED_PATHS: ${{ steps.write-path.outputs.changed_paths }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          base_branch="${BASE_BRANCH:-main}"
          safe_branch="$(printf '%s' "${base_branch}" | sed 's#[^A-Za-z0-9._-]#-#g')"
          if [[ -z "${safe_branch}" ]]; then
            safe_branch="default"
          fi
          # Validate base_branch is a safe format before passing to gh CLI to prevent
          # flag injection via a maliciously-renamed default branch.
          if [[ ! "${base_branch}" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::Unexpected default_branch format: ${base_branch}" >&2
            exit 1
          fi
          pr_branch="ci3/pr-producer-${safe_branch}"

          mapfile -t changed_paths < <(printf '%s\n' "${CHANGED_PATHS}" | sed '/^$/d')
          if [[ "${#changed_paths[@]}" -eq 0 ]]; then
            echo "No changed paths passed from CI-3 write-path step; skipping PR update."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git

          git checkout -B "${pr_branch}"
          git add -- "${changed_paths[@]}"

          if git diff --cached --quiet; then
            echo "No staged diff after allowlist staging; skipping PR update."
            exit 0
          fi

          git commit -m "CI-3: apply deterministic knowledgebase updates"
          git push --force-with-lease origin "${pr_branch}"

          pr_number="$({
            gh pr list --head "${pr_branch}" --base "${base_branch}" --state open --json number --jq '.[0].number // ""'
          } || true)"

          pr_title="CI-3: deterministic knowledgebase updates"
          pr_body=$'Automated by CI-3 PR producer.\n\n- Profile: tp-pr-producer\n- Allowlist: wiki/**, wiki/index.md, wiki/log.md, raw/processed/**, raw/rejected/**\n- Merge remains gated by required checks and approvals.'

          if [[ -n "${pr_number}" ]]; then
            gh pr edit "${pr_number}" --title "${pr_title}" --body "${pr_body}"
          else
            gh pr create --base "${base_branch}" --head "${pr_branch}" --title "${pr_title}" --body "${pr_body}"
          fi

      - name: Record CI-3 no-op state
        if: steps.sources.outputs.has_sources != 'true' || steps.write-path.outputs.has_changes != 'true'
        run: |
          set -euo pipefail
          echo "CI-3 completed with no PR update."
