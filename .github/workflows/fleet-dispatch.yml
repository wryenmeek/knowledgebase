# .github/workflows/fleet-dispatch.yml
#
# Phase 2 of the fleet pipeline (event-driven, ~2 min):
#   Triggered when any PR is opened. Checks whether it is the Jules planning
#   PR for the pending session stored in .fleet/.pending_session. If so:
#     1. Merges the planning PR into the base branch.
#     2. Removes .fleet/.pending_session so the next plan cycle is clean.
#     3. Runs fleet-dispatch.ts to spawn one Jules session per task.
#
# Phase 1 (fleet-plan.yml) runs on a schedule and writes .fleet/.pending_session.
name: Fleet Dispatch

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: fleet-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    # Pre-filter: only allocate a runner for plausibly-Jules-authored planning
    # PRs. Three trust layers (all must pass):
    #   1. PR opener (user.login) is the Jules bot OR the repository owner.
    #      Jules currently posts the planning PR via the operator's PAT, so the
    #      opener is the human owner, not the bot. The 'google-labs-jules'
    #      branch is preserved in case Jules's auth model flips back to the
    #      bot identity.
    #   2. Branch follows one of the known Jules planning prefixes
    #      (issue-analysis-output-<session_id>, fleet-triage-tasks-<session_id>,
    #      or the legacy jules/ and fleet/ prefixes). This is defense in depth
    #      against a collaborator opening an unrelated PR that would otherwise
    #      burn a runner before the session-ID step gates it out.
    #   3. (Downstream, in the "Check if this PR is the fleet planning PR"
    #      step below.) The session ID encoded in the branch name OR PR body
    #      must match .fleet/.pending_session on the fleet-state branch. This
    #      is the authoritative gate that no collaborator can spoof without
    #      first reading the unprotected fleet-state branch and crafting a
    #      branch name with the exact pending session ID.
    #
    # Earlier this filter was just `user.login == 'google-labs-jules'` (committed
    # 2026-05-18). Jules's auth model shifted to PAT-based posting at some point
    # after that, silently skipping every planning PR for weeks. See PR #308 /
    # Issue #82 diagnosis trail (2026-06-20).
    if: |
      (github.event.pull_request.user.login == 'google-labs-jules' ||
       github.event.pull_request.user.login == github.repository_owner) &&
      (startsWith(github.event.pull_request.head.ref, 'issue-analysis-output-') ||
       startsWith(github.event.pull_request.head.ref, 'fleet-triage-tasks-') ||
       startsWith(github.event.pull_request.head.ref, 'jules/') ||
       startsWith(github.event.pull_request.head.ref, 'fleet/'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout base branch
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # Always check out main (not the PR head) so we can run fleet-dispatch.ts.
          ref: main
          fetch-depth: 0

      - name: Check if this PR is the fleet planning PR
        id: check
        env:
          PR_NUMBER:   ${{ github.event.pull_request.number }}
          PR_BODY:     ${{ github.event.pull_request.body }}
          PR_BRANCH:   ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          # Read pending session from fleet-state branch (unprotected state branch).
          git fetch origin fleet-state 2>/dev/null || true
          if ! git rev-parse origin/fleet-state >/dev/null 2>&1; then
            echo "ℹ️  No fleet-state branch. Skipping."
            echo "is_fleet_pr=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PENDING_DATA=$(git show origin/fleet-state:.fleet/.pending_session 2>/dev/null || echo "")
          if [ -z "$PENDING_DATA" ]; then
            echo "ℹ️  No pending fleet session in fleet-state. Skipping."
            echo "is_fleet_pr=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PENDING_SESSION_ID=$(printf '%s' "$PENDING_DATA" | sed -n '1p')
          PENDING_BASE=$(printf '%s' "$PENDING_DATA" | sed -n '2p')
          PENDING_DATE=$(printf '%s' "$PENDING_DATA" | sed -n '3p')

          # Match: session ID appears in PR body OR in the branch name.
          if echo "$PR_BODY" | grep -qF "$PENDING_SESSION_ID" || \
             echo "$PR_BRANCH" | grep -qF "$PENDING_SESSION_ID"; then
            echo "✅ PR #$PR_NUMBER matches pending session $PENDING_SESSION_ID"
            {
              echo "is_fleet_pr=true"
              echo "pending_session=$PENDING_SESSION_ID"
              echo "pending_base=$PENDING_BASE"
              echo "pending_date=$PENDING_DATE"
            } >> "$GITHUB_OUTPUT"
          else
            echo "ℹ️  PR #$PR_NUMBER (branch: $PR_BRANCH) does not match pending session $PENDING_SESSION_ID. Skipping."
            echo "is_fleet_pr=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge planning PR
        if: steps.check.outputs.is_fleet_pr == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" --squash --delete-branch
          echo "✅ Planning PR #$PR_NUMBER merged."

      - name: Clear pending session file
        if: steps.check.outputs.is_fleet_pr == 'true'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B fleet-state origin/fleet-state
          rm -f .fleet/.pending_session
          git add .fleet/.pending_session
          if git diff --cached --quiet; then
            echo "Nothing to clear in fleet-state."
          else
            git commit -m "chore(fleet): clear pending session after planning PR merged"
            git push origin fleet-state
          fi

      - name: Setup Bun
        if: steps.check.outputs.is_fleet_pr == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.1"

      - name: Install fleet dependencies
        if: steps.check.outputs.is_fleet_pr == 'true'
        working-directory: scripts/fleet
        run: bun install

      - name: Dispatch task sessions
        if: steps.check.outputs.is_fleet_pr == 'true'
        working-directory: scripts/fleet
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # SECURITY: pending_base (→ FLEET_BASE_BRANCH) originates from the
          # unprotected fleet-state branch. Use env-var indirection (same as
          # FLEET_PENDING_DATE) so GitHub Actions does not expand it before the
          # shell runs. The git pull uses -- to prevent flag injection.
          FLEET_BASE_BRANCH: ${{ steps.check.outputs.pending_base }}
          # SECURITY: pending_date is read from the unprotected fleet-state branch;
          # pass through env var to prevent shell injection via expression expansion.
          FLEET_PENDING_DATE: ${{ steps.check.outputs.pending_date }}
        run: |
          set -euo pipefail
          # SECURITY: -- terminates git option parsing so a crafted FLEET_BASE_BRANCH
          # (from unprotected fleet-state) cannot inject git flags like --upload-pack.
          git pull --ff-only origin -- "$FLEET_BASE_BRANCH"
          bun fleet-dispatch.ts
