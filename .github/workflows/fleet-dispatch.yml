# .github/workflows/fleet-dispatch.yml
#
# Phase 2a of the fleet pipeline (event-driven, ~30s):
#   Triggered when any PR is opened. Checks whether it is the Jules planning
#   PR for the pending session stored in .fleet/.pending_session. If so:
#     1. Queues an auto-merge of the planning PR (`gh pr merge --auto`).
#        The merge happens AFTER all branch-protection requirements pass
#        (e.g., the CI-2 diagnostics check), not immediately.
#   This workflow does NOT clear .fleet/.pending_session or fan out the
#   per-task agent dispatch — those happen in Phase 2b, the companion
#   fleet-dispatch-after-merge.yml workflow which triggers on `push` to main
#   when the planning artifact lands.
#
# The two-phase split exists because branch protection requires the CI-2
# diagnostics check to pass before merge, but CI-2 takes ~90s while the
# planning-PR-opened event fires immediately. Earlier this workflow ran
# `gh pr merge --squash` synchronously and raced (and lost) to CI-2,
# silently failing every dispatch. See Issue #82 Layer 4 diagnosis trail.
#
# Phase 1 (fleet-plan.yml) runs on a schedule and writes .fleet/.pending_session.
# Phase 2a (this workflow) queues the planning-PR merge.
# Phase 2b (fleet-dispatch-after-merge.yml) clears .pending_session and fans
# out the per-task agent sessions once the planning artifact lands on main.
name: Fleet Dispatch

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: fleet-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    # Pre-filter: only allocate a runner for plausibly-Jules-authored PRs.
    #
    # Two-identity login check (downstream session-ID check is the real gate):
    #   1. 'google-labs-jules' — the historical bot identity, preserved in
    #      case Jules's auth model flips back to bot-as-opener.
    #   2. github.repository_owner — covers the current PAT-based model where
    #      Jules posts the planning PR via the operator's PAT, making the
    #      opener the human owner. Using github.repository_owner (not a
    #      hardcoded username) keeps the filter portable across forks/transfers.
    #
    # The May 18 filter (committed in afb1035) was just
    # `user.login == 'google-labs-jules'`. Jules's auth model shifted to
    # PAT-based posting some time after that, silently skipping every Jules
    # planning PR for weeks (observed across #299, #307, #308). The
    # broadened identity check above restores dispatch.
    #
    # The downstream "Check if this PR is the fleet planning PR" step compares
    # the session ID encoded in the branch/body to .fleet/.pending_session and
    # short-circuits any PR that doesn't match — so widening the opener filter
    # cannot trigger dispatch on unrelated PRs. The test in
    # tests/kb/test_fleet_merge_workflow.py (FleetDispatchInjectionGuardTests
    # .test_author_filter_uses_login_equality_only) still enforces the
    # "no branch-prefix bypass" contract.
    #
    # Refs: PR #308, Issue #82 diagnosis (2026-06-20).
    if: |
      github.event.pull_request.user.login == 'google-labs-jules' ||
      github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout base branch
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # Check out main only to read fleet-state for session ID matching.
          # Phase 2a no longer runs fleet-dispatch.ts (moved to Phase 2b).
          ref: main
          fetch-depth: 1

      - name: Check if this PR is the fleet planning PR
        id: check
        env:
          GH_TOKEN:    ${{ github.token }}
          REPOSITORY:  ${{ github.repository }}
          PR_NUMBER:   ${{ github.event.pull_request.number }}
          PR_BODY:     ${{ github.event.pull_request.body }}
          PR_BRANCH:   ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          # Read pending session from fleet-state branch (unprotected state branch).
          git fetch origin fleet-state 2>/dev/null || true
          if ! git rev-parse origin/fleet-state >/dev/null 2>&1; then
            echo "ℹ️  No fleet-state branch. Skipping."
            echo "is_fleet_pr=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PENDING_DATA=$(git show origin/fleet-state:.fleet/.pending_session 2>/dev/null || echo "")
          if [ -z "$PENDING_DATA" ]; then
            echo "ℹ️  No pending fleet session in fleet-state. Skipping."
            echo "is_fleet_pr=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PENDING_SESSION_ID=$(printf '%s' "$PENDING_DATA" | sed -n '1p' | tr -d '\r')
          PENDING_DATE=$(printf '%s' "$PENDING_DATA" | sed -n '3p' | tr -d '\r')
          if [ -z "$PENDING_SESSION_ID" ] || printf '%s' "$PENDING_SESSION_ID" | grep -q '[[:cntrl:]]'; then
            echo "❌ Malformed pending fleet session ID. Refusing to classify PR #$PR_NUMBER as a fleet planning PR."
            exit 1
          fi

          # Match: session ID appears in PR body OR in the branch name.
          if echo "$PR_BODY" | grep -qF -- "$PENDING_SESSION_ID" || \
             echo "$PR_BRANCH" | grep -qF -- "$PENDING_SESSION_ID"; then
            if ! echo "$PENDING_DATE" | grep -Eq '^[0-9]{4}_[0-9]{2}_[0-9]{2}$'; then
              echo "❌ Fleet pre-merge sanity check failed: pending fleet date is not YYYY_MM_DD."
              exit 1
            fi
            if ! PR_FILES_TSV="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER/files" --paginate --jq '.[] | [.filename, .status, (.previous_filename // "")] | @tsv')"; then
              echo "❌ Fleet pre-merge sanity check failed: could not inspect planning PR #$PR_NUMBER files."
              exit 1
            fi
            if [ -z "$PR_FILES_TSV" ]; then
              echo "❌ Fleet pre-merge sanity check failed: planning PR #$PR_NUMBER has a 0/0/0 diff."
              exit 1
            fi
            EXPECTED_MD=".fleet/${PENDING_DATE}/issue_tasks.md"
            EXPECTED_JSON=".fleet/${PENDING_DATE}/issue_tasks.json"
            PR_DIFF_FILES=()
            while IFS=$'\t' read -r changed_path changed_status previous_path; do
              if [ -z "$changed_path" ]; then
                continue
              fi
              PR_DIFF_FILES+=("$changed_path")
              if [ "$changed_status" = "removed" ] || [ "$changed_status" = "renamed" ]; then
                echo "❌ Fleet pre-merge sanity check failed: planning PR #$PR_NUMBER has unsupported $changed_status path $changed_path (previous: ${previous_path:-n/a})."
                exit 1
              fi
            done <<< "$PR_FILES_TSV"
            for expected_path in "$EXPECTED_MD" "$EXPECTED_JSON"; do
              if ! printf '%s\n' "${PR_DIFF_FILES[@]}" | grep -Fxq "$expected_path"; then
                echo "❌ Fleet pre-merge sanity check failed: planning PR #$PR_NUMBER is missing expected path $expected_path."
                exit 1
              fi
            done
            for changed_path in "${PR_DIFF_FILES[@]}"; do
              if [ "$changed_path" != "$EXPECTED_MD" ] && [ "$changed_path" != "$EXPECTED_JSON" ]; then
                echo "❌ Fleet pre-merge sanity check failed: planning PR #$PR_NUMBER changed unexpected path $changed_path."
                exit 1
              fi
            done
            echo "✅ PR #$PR_NUMBER matches pending session $PENDING_SESSION_ID"
            echo "✅ Fleet pre-merge sanity check passed for planning artifacts."
            echo "is_fleet_pr=true" >> "$GITHUB_OUTPUT"
          else
            echo "ℹ️  PR #$PR_NUMBER (branch: $PR_BRANCH) does not match pending session $PENDING_SESSION_ID. Skipping."
            echo "is_fleet_pr=false" >> "$GITHUB_OUTPUT"
          fi

      # Issue #310 / ADR-036: secrets cannot be referenced directly in step `if:`
      # conditionals, so detect optional fleet-orchestrator App credentials from
      # step-scoped env first and gate token creation on this output.
      - name: Detect fleet-orchestrator App auto-merge credentials
        id: app-token-inputs
        if: steps.check.outputs.is_fleet_pr == 'true'
        env:
          FLEET_APP_ID: ${{ secrets.FLEET_APP_ID }}
          FLEET_APP_PRIVATE_KEY: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$FLEET_APP_ID" ] && [ -n "$FLEET_APP_PRIVATE_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      # Issue #310 / ADR-036: App-authored auto-merges produce normal push events
      # so Phase 2b can fire automatically. Uses the dedicated `fleet-orchestrator`
      # App (FLEET_APP_ID / FLEET_APP_PRIVATE_KEY) — NOT the narrow read-only
      # kb-source-monitor App (GH_APP_ID / GH_APP_PRIVATE_KEY).
      - name: Create fleet-orchestrator App token for auto-merge
        id: app-token
        if: steps.app-token-inputs.outputs.available == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        continue-on-error: true
        with:
          app-id: ${{ secrets.FLEET_APP_ID }}
          private-key: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Queue auto-merge of planning PR
        if: steps.check.outputs.is_fleet_pr == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          APP_TOKEN_AVAILABLE: ${{ steps.app-token-inputs.outputs.available }}
          APP_TOKEN_CREATED: ${{ steps.app-token.outputs.token != '' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$APP_TOKEN_AVAILABLE" = "true" ] && [ "$APP_TOKEN_CREATED" = "true" ]; then
            TOKEN_MODE="github_app"
            echo "✅ Issue #310: using fleet-orchestrator App installation token for planning PR auto-merge."
          elif [ "$APP_TOKEN_AVAILABLE" = "true" ] && [ "$APP_TOKEN_CREATED" != "true" ]; then
            # Issue #310 / ADR-036: FLEET_APP_* secrets are configured but the
            # App-token creation step failed. See the previous step's log for the
            # specific HTTP status (typically 422 "permissions requested are not
            # granted to this installation").
            TOKEN_MODE="github_token"
            echo "::warning title=Issue #310 fleet-orchestrator App token creation failed::FLEET_APP_* secrets are present but \`actions/create-github-app-token\` returned an error (see previous step log for the exact status and message). For status 422 \"permissions requested are not granted\", grant the fleet-orchestrator App \`contents:write\` + \`pull-requests:write\` + \`issues:write\` at Settings → Developer settings → GitHub Apps → fleet-orchestrator → Permissions & events AND re-accept the installation at Settings → Developer settings → GitHub Apps → fleet-orchestrator → Install App → wryenmeek → Configure. Do NOT widen the kb-source-monitor App. Falling back to GITHUB_TOKEN — Layer 6 push-trigger suppression persists until the App token succeeds."
          else
            # Issue #310 / ADR-036: fleet-orchestrator App secrets are not configured.
            # Operator must provision the App and store its ID + private-key PEM as
            # FLEET_APP_ID and FLEET_APP_PRIVATE_KEY. See the one-click manifest in
            # raw/inbox/cloneable-template.md § GitHub App for Fleet Orchestration.
            TOKEN_MODE="github_token"
            echo "::warning title=Issue #310 fleet-orchestrator App secrets not configured::No FLEET_APP_ID/FLEET_APP_PRIVATE_KEY secrets found. Provision the fleet-orchestrator GitHub App (one-click manifest in raw/inbox/cloneable-template.md § GitHub App for Fleet Orchestration) with contents:write + pull-requests:write + issues:write + metadata:read on this repo and store its ID + private-key PEM as FLEET_APP_ID and FLEET_APP_PRIVATE_KEY repository secrets to enable Phase 2b push-trigger auto-dispatch. Falling back to GITHUB_TOKEN — Layer 6 push-trigger suppression persists."
          fi
          # --auto queues the merge so it happens after all branch-protection
          # required checks pass (notably CI-2 diagnostics). This avoids the
          # earlier race where the synchronous --squash merge fired before
          # CI-2 finished and lost. Phase 2b (fleet-dispatch-after-merge.yml)
          # picks up from the `push` event when the merge eventually lands.
          gh pr merge "$PR_NUMBER" --auto --squash --delete-branch
          if [ "$TOKEN_MODE" = "github_app" ]; then
            echo "✅ Planning PR #$PR_NUMBER queued with fleet-orchestrator App token. Phase 2b should dispatch once merge lands."
          else
            echo "✅ Planning PR #$PR_NUMBER queued with GITHUB_TOKEN fallback. Use the Phase 2b workflow_dispatch escape hatch if no push-triggered run appears."
          fi

