name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - scripts/fleet/**
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - scripts/fleet/**

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install Python package and dev dependencies
        run: |
          pip install --quiet -e ".[dev,drive-monitor]"
          pip install --quiet pytest pre-commit

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.1"

      - name: Install TypeScript fleet dependencies
        working-directory: scripts/fleet
        run: bun install

      - name: Verify Python setup
        run: |
          python3 -c "import scripts.kb.contracts; print('scripts.kb OK')"
          python3 -m pytest --co -q 2>&1 | tail -3

      - name: Run fleet Bun tests
        working-directory: scripts/fleet
        run: bun test --bail

      - name: Verify Bun setup
        working-directory: scripts/fleet
        run: bun build fleet-plan.ts fleet-dispatch.ts fleet-merge.ts --outdir /tmp/fleet-check
