name: CI-2 Analyst Read-Only Diagnostics

on:
  pull_request:
    branches: [main]
  # Run full diagnostics on pushes to main (post-merge gate).
  # Feature branches are covered by the pull_request trigger above — running
  # the full 15-minute suite on every feature branch push is redundant.
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: read

concurrency:
  group: kb-readonly-ci2-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyst-diagnostics:
    name: CI-2 diagnostics (tp-analyst-readonly)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      checks: read
      contents: read
      issues: read
    env:
      CI_ID: CI-2
      TOKEN_PROFILE: tp-analyst-readonly
      CLOSURE_EVIDENCE_POLICY_START: "2026-06-30T00:00:00Z"
    steps:
      - name: Checkout repository snapshot (read-only token)
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        # TODO: upgrade once gitleaks/gitleaks-action releases a node24-compatible version.
        # v2.3.9 (latest) still uses node20; tracked at github.com/gitleaks/gitleaks-action/issues.
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false  # CI-2 is read-only; no pull-requests:write

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Cache pip dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py3.12-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-py3.12-

      - name: Dependency vulnerability audit (pip-audit)
        run: |
          set -euo pipefail
          python -m pip install --quiet 'pip>=26.1.2' pip-audit
          # CVE-2026-3219 affects pip 26.x — no upstream fix version published.
          # TODO(2026-12): re-evaluate once upstream releases a fix for CVE-2026-3219.
          pip-audit --desc on --ignore-vuln CVE-2026-3219

      - name: Install pinned qmd runtime
        run: |
          set -euo pipefail
          QMD_NPM_PACKAGE="@tobilu/qmd"
          QMD_VERSION="2.5.1"
          QMD_EXPECTED_INTEGRITY="sha512-Ep9ccOj1bNRinfTIszp5UZP8xfi5AJNtmzwWDD4ZVm2YdWVS+rFobWJQovj0HD2uIAFrryvbSpZYeGa3flEO7g==" # pragma: allowlist secret
          QMD_DIST_INTEGRITY="$(npm view "${QMD_NPM_PACKAGE}@${QMD_VERSION}" dist.integrity --registry=https://registry.npmjs.org)"
          if [ "${QMD_DIST_INTEGRITY}" != "${QMD_EXPECTED_INTEGRITY}" ]; then
            echo "::error::qmd dist.integrity mismatch (expected ${QMD_EXPECTED_INTEGRITY}, got ${QMD_DIST_INTEGRITY})" >&2
            exit 1
          fi
          npm install --global "${QMD_NPM_PACKAGE}@${QMD_VERSION}" --registry=https://registry.npmjs.org
          qmd init
          mkdir -p .qmd/index
          cp .qmd/index.sqlite .qmd/index/index.sqlite
          cp .qmd/index.yml .qmd/index/index.yml
          python3 scripts/kb/qmd_preflight.py --repo-root .

      - name: Assert CI-2 read-only profile context
        run: |
          set -euo pipefail
          test "${CI_ID}" = "CI-2"
          test "${TOKEN_PROFILE}" = "tp-analyst-readonly"
          mkdir -p diagnostics
          {
            echo "ci_id=${CI_ID}"
            echo "token_profile=${TOKEN_PROFILE}"
            echo "permission_contract=actions:read,checks:read,contents:read,issues:read"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "sha=${GITHUB_SHA}"
          } | tee diagnostics/context.log

      - name: Install test dependencies
        run: pip install --quiet pytest pytest-cov pyyaml

      - name: Run analyst diagnostics (lint + unit tests)
        id: diagnostics
        continue-on-error: true
        run: |
          set -uo pipefail
          # GitHub invokes bash with -e by default. Disable fail-fast so this step
          # always captures all command exit codes and emits outputs deterministically.
          set +e
          mkdir -p diagnostics
          : > diagnostics/diagnostics.log

          wrapper_start="$(date -u +%s)"
          echo "[CI-2] validate_wiki_governance wrapper" | tee -a diagnostics/diagnostics.log
          python3 .github/skills/validate-wiki-governance/logic/validate_wiki_governance.py --quiet 2>&1 | tee -a diagnostics/diagnostics.log
          wrapper_exit="${PIPESTATUS[0]}"
          wrapper_end="$(date -u +%s)"
          wrapper_duration="$((wrapper_end - wrapper_start))"

          freshness_start="$(date -u +%s)"
          echo "[CI-2] check_doc_freshness --scope wiki --path wiki/concepts --path wiki/entities --path wiki/analyses" | tee -a diagnostics/diagnostics.log
          python3 scripts/validation/check_doc_freshness.py --scope wiki --path wiki/concepts --path wiki/entities --path wiki/analyses --as-of "$(date -u +%Y-%m-%d)" --max-age-days 90 --failures-only 2>&1 | tee -a diagnostics/diagnostics.log
          freshness_exit="${PIPESTATUS[0]}"
          freshness_end="$(date -u +%s)"
          freshness_duration="$((freshness_end - freshness_start))"

          quality_start="$(date -u +%s)"
          echo "[CI-2] content_quality_report --mode summary" | tee -a diagnostics/diagnostics.log
          python3 scripts/reporting/content_quality_report.py --mode summary --path wiki --failures-only 2>&1 | tee -a diagnostics/diagnostics.log
          quality_exit="${PIPESTATUS[0]}"
          quality_end="$(date -u +%s)"
          quality_duration="$((quality_end - quality_start))"

          lint_start="$(date -u +%s)"
          echo "[CI-2] lint_wiki --strict" | tee -a diagnostics/diagnostics.log
          python3 scripts/kb/lint_wiki.py --wiki-root wiki --strict 2>&1 | tee -a diagnostics/diagnostics.log
          lint_exit="${PIPESTATUS[0]}"
          lint_end="$(date -u +%s)"
          lint_duration="$((lint_end - lint_start))"

          tests_start="$(date -u +%s)"
          echo "[CI-2] pytest" | tee -a diagnostics/diagnostics.log
          python3 -m pytest tests/ -q --cov=scripts/kb --cov=scripts.validation._runtime_budget --cov-fail-under=90 2>&1 | tee -a diagnostics/diagnostics.log
          tests_exit="${PIPESTATUS[0]}"
          tests_end="$(date -u +%s)"
          tests_duration="$((tests_end - tests_start))"

          diagnostics_exit=0
          if [ "${wrapper_exit}" -ne 0 ] || [ "${freshness_exit}" -ne 0 ] || [ "${quality_exit}" -ne 0 ] || [ "${lint_exit}" -ne 0 ] || [ "${tests_exit}" -ne 0 ]; then
            diagnostics_exit=1
          fi

          WRAPPER_DURATION="${wrapper_duration}" \
          FRESHNESS_DURATION="${freshness_duration}" \
          QUALITY_DURATION="${quality_duration}" \
          LINT_DURATION="${lint_duration}" \
          TESTS_DURATION="${tests_duration}" \
          python3 - <<'PY' > diagnostics/runtime-metrics.json
          import json
          import os

          payload = {
              "workflow_id": "ci-2-analyst-diagnostics",
              "stage_durations_seconds": {
                  "validate_wiki_governance": int(os.environ["WRAPPER_DURATION"]),
                  "check_doc_freshness": int(os.environ["FRESHNESS_DURATION"]),
                  "content_quality_summary": int(os.environ["QUALITY_DURATION"]),
                  "check_issue_closure_evidence": 0,
                  "lint_wiki_strict": int(os.environ["LINT_DURATION"]),
                  "pytest_suite": int(os.environ["TESTS_DURATION"]),
              },
          }
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

          echo "[CI-2] wrapper_exit=${wrapper_exit} freshness_exit=${freshness_exit} quality_exit=${quality_exit} lint_exit=${lint_exit} tests_exit=${tests_exit} diagnostics_exit=${diagnostics_exit}" | tee -a diagnostics/diagnostics.log
          echo "exit_code=${diagnostics_exit}" >> "${GITHUB_OUTPUT}"
          {
            echo "wrapper_exit=${wrapper_exit}"
            echo "freshness_exit=${freshness_exit}"
            echo "quality_exit=${quality_exit}"
            echo "lint_exit=${lint_exit}"
            echo "tests_exit=${tests_exit}"
          } >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Check issue closure evidence
        id: closure-evidence
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # Keep this step non-fail-fast so closure_evidence_exit is always emitted.
          set +e
          mkdir -p diagnostics
          closure_evidence_start="$(date -u +%s)"
          echo "[CI-2] check_issue_closure_evidence --closed-after ${CLOSURE_EVIDENCE_POLICY_START}" | tee -a diagnostics/diagnostics.log
          python3 -m scripts.validation.check_issue_closure_evidence --lookback-days 3650 --issue-limit 500 --closed-after "${CLOSURE_EVIDENCE_POLICY_START}" 2>&1 | tee -a diagnostics/diagnostics.log
          closure_evidence_exit="${PIPESTATUS[0]}"
          closure_evidence_end="$(date -u +%s)"
          closure_evidence_duration="$((closure_evidence_end - closure_evidence_start))"
          echo "[CI-2] closure_evidence_exit=${closure_evidence_exit}" | tee -a diagnostics/diagnostics.log
          echo "closure_evidence_exit=${closure_evidence_exit}" >> "${GITHUB_OUTPUT}"
          CLOSURE_EVIDENCE_DURATION="${closure_evidence_duration}" \
          python3 - <<'PY'
          import json, os
          metrics_path = 'diagnostics/runtime-metrics.json'
          payload = json.loads(open(metrics_path).read())
          payload['stage_durations_seconds']['check_issue_closure_evidence'] = int(os.environ['CLOSURE_EVIDENCE_DURATION'])
          open(metrics_path, 'w').write(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          PY
          exit 0

      - name: Evaluate CI-2 runtime budgets
        id: runtime-budget
        if: ${{ always() && steps.diagnostics.outputs.exit_code != '' && steps.closure-evidence.outputs.closure_evidence_exit != '' }}
        run: |
          set -euo pipefail
          python3 -m scripts.validation.evaluate_runtime_budget \
            --metrics diagnostics/runtime-metrics.json \
            --report diagnostics/runtime-budget-report.json \
            --budget-config schema/runtime-budgets.json

      - name: Warn on CI-2 runtime budget breaches
        if: steps.runtime-budget.outputs.overall_status == 'warn'
        run: |
          set -euo pipefail
          echo "::warning::CI-2 runtime budgets exceeded warn threshold(s). See diagnostics/runtime-budget-report.json and the step summary."

      - name: Upload diagnostics artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ci2-analyst-diagnostics-${{ github.run_id }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 14

      - name: Fail explicitly when diagnostics fail or runtime budgets fail
        if: ${{ always() && (steps.diagnostics.outcome != 'success' || steps.closure-evidence.outcome != 'success' || steps.diagnostics.outputs.exit_code != '0' || steps.closure-evidence.outputs.closure_evidence_exit != '0' || steps.runtime-budget.outputs.overall_status == 'fail') }}
        env:
          DIAGNOSTICS_OUTCOME: ${{ steps.diagnostics.outcome }}
          CLOSURE_EVIDENCE_OUTCOME: ${{ steps.closure-evidence.outcome }}
          WRAPPER_EXIT: ${{ steps.diagnostics.outputs.wrapper_exit }}
          FRESHNESS_EXIT: ${{ steps.diagnostics.outputs.freshness_exit }}
          QUALITY_EXIT: ${{ steps.diagnostics.outputs.quality_exit }}
          CLOSURE_EVIDENCE_EXIT: ${{ steps.closure-evidence.outputs.closure_evidence_exit }}
          LINT_EXIT: ${{ steps.diagnostics.outputs.lint_exit }}
          TESTS_EXIT: ${{ steps.diagnostics.outputs.tests_exit }}
          RUNTIME_BUDGET_STATUS: ${{ steps.runtime-budget.outputs.overall_status }}
        run: |
          set -euo pipefail
          [ "${DIAGNOSTICS_OUTCOME}" = "success" ] || echo "::error::Run analyst diagnostics step failed before emitting complete outputs."
          [ "${CLOSURE_EVIDENCE_OUTCOME}" = "success" ] || echo "::error::Check issue closure evidence step failed before emitting complete outputs."
          [ "${WRAPPER_EXIT}" = "0" ] || echo "::error::validate_wiki_governance failed. FIX: run python3 .github/skills/validate-wiki-governance/logic/validate_wiki_governance.py --quiet locally to see failures."
          [ "${FRESHNESS_EXIT}" = "0" ] || echo "::error::check_doc_freshness failed. FIX: update the updated_at frontmatter field on stale pages. See diagnostics artifacts for which files."
          [ "${QUALITY_EXIT}" = "0" ] || echo "::error::content_quality_report failed. FIX: add missing sources/updated_at fields or resolve placeholder markers in affected wiki pages."
          [ "${CLOSURE_EVIDENCE_EXIT}" = "0" ] || echo "::error::check_issue_closure_evidence failed. FIX: add closure evidence comments to newly closed security/refactor/testing/hardening issues and rerun python3 -m scripts.validation.check_issue_closure_evidence locally."
          [ "${LINT_EXIT}" = "0" ] || echo "::error::lint_wiki failed. FIX: run python3 scripts/kb/lint_wiki.py --wiki-root wiki --strict locally to see violations with remediation hints."
          [ "${TESTS_EXIT}" = "0" ] || echo "::error::pytest failed. FIX: run python3 -m pytest tests/ -q locally to see failures."
          [ "${RUNTIME_BUDGET_STATUS}" != "fail" ] || echo "::error::CI-2 runtime budgets exceeded fail threshold(s). See diagnostics/runtime-budget-report.json and the step summary for remediation."
          exit 1

  lint-workflows:
    name: CI-2 workflow lint (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository snapshot
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: raven-actions/actionlint@205b530c5d9fa8f44ae9ed59f341a0db994aa6f8 # v2
        with:
          files: ".github/workflows/*.yml"
